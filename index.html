<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ANGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DotGothic16&family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b0b0c">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
 --bg:#0b0b0c;--panel:#141415;--panel2:#1b1b1d;--line:#2a2a2d;--line2:#3a3a3e99;
 --text:#ececec;--sub:#8a8a8f;
 --key:#f2f2f2;--key-rgb:242 242 242;
 --ok:#3ee894;--ok-rgb:62 232 148;
 --ng:#ff5268;--ng-rgb:255 82 104;
 --send:#4d9bff;--send-rgb:77 155 255;
 --recv:#b77bff;--recv-rgb:183 123 255;
 --paper:#0e0e0f;--paper2:#0e0e0f;--ink:#f5f5f5;
 --f-body:"Zen Kaku Gothic New",system-ui,sans-serif;
 --f-cipher:"DotGothic16","M PLUS 1 Code",monospace;
 --f-disp:"Space Grotesk","Zen Kaku Gothic New",sans-serif;
 --f-mono:"IBM Plex Mono","Zen Kaku Gothic New",monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh;
 background:
  radial-gradient(900px 500px at 50% -160px,rgb(255 255 255/.05),transparent 70%),
  repeating-linear-gradient(0deg,rgb(var(--key-rgb)/.035) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgb(var(--key-rgb)/.035) 0 1px,transparent 1px 28px),
  var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:14px 16px 56px}
::selection{background:rgb(var(--key-rgb)/.35)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
button:not(:disabled):active{transform:translateY(1px)}
button:disabled{cursor:default}
.primary:not(:disabled):hover{background:#fff}
.primary{background:#f0f0f0;color:#0b0b0c;border-color:#fff;font-weight:900;letter-spacing:.08em;box-shadow:none}
.primary:disabled{opacity:.3;box-shadow:none}
.big{width:100%;padding:14px;font-size:16px;margin-top:10px}
.big:not(.primary){background:transparent;border-color:var(--line2)}
.big:not(.primary):not(:disabled):hover{border-color:rgb(var(--key-rgb)/.6)}
.ghost{background:transparent;border-color:var(--line)}
.small{font-size:12px;padding:5px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;box-shadow:inset 0 1px 0 rgb(255 255 255/.03),0 10px 30px -18px #000}
h3{margin:0 0 10px;padding-left:9px;border-left:2px solid var(--key);font-size:12px;line-height:1.2;color:var(--sub);font-weight:700;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--sub);font-size:12.5px}
.center{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:4px}
.logo{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.2em;color:var(--key);line-height:1;}
.logo small{font-size:11px;color:var(--sub);font-weight:500}
.hero{text-align:center;padding:52px 0 18px;position:relative}
.hero .logo{font-size:64px;letter-spacing:.18em;padding-left:.18em;}
.hero .cls{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.32em;color:var(--sub);margin-top:6px}
.hero .tagline{margin-top:14px;font-size:14px;letter-spacing:.08em}
.stamp{position:absolute;top:40px;right:calc(50% - 160px);transform:rotate(12deg);border:2.5px solid var(--ng);color:var(--ng);font-weight:900;font-size:15px;letter-spacing:.2em;padding:2px 6px 2px 9px;border-radius:4px;opacity:.85;mix-blend-mode:screen}
.code{font-family:var(--f-disp);font-size:46px;font-weight:900;letter-spacing:.24em;padding-left:.24em;color:var(--key);line-height:1.1}
input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0f0f10;color:var(--text);margin-top:5px;outline:none;transition:border-color .15s}
input:focus{border-color:rgb(var(--key-rgb)/.7)}
label{display:block;margin-top:12px;font-size:12px;color:var(--sub);letter-spacing:.1em}
.err{color:var(--ng);font-size:13px;margin-top:10px;text-align:center;min-height:1.5em}
.note{color:var(--sub);font-size:12px;margin-top:8px}
.ic{width:1em;height:1em;vertical-align:-.15em;flex:none}
.timer{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--panel2);padding:3px 10px;border-radius:99px}
.timer.hurry{color:var(--ng)}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;letter-spacing:.06em;line-height:1.5}
.t-send{color:var(--send)}.t-recv{color:var(--recv)}.t-inter{color:var(--sub)}
.pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.role{font-size:18px;font-weight:900;letter-spacing:.04em}
.keybox{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgb(var(--key-rgb)/.14),rgb(var(--key-rgb)/.04));border:1px solid rgb(var(--key-rgb)/.35);border-left:3px solid var(--key);border-radius:8px;padding:9px 12px;margin-top:10px;color:var(--key)}
.keybox b{font-size:16px}
.keybox .sub{color:var(--sub)}
.tgbox{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgb(var(--send-rgb)/.14),rgb(var(--send-rgb)/.04));border:1px solid rgb(var(--send-rgb)/.35);border-left:3px solid var(--send);border-radius:8px;padding:9px 12px;margin-top:8px;color:var(--send)}
.tgbox b{font-size:19px;letter-spacing:.04em}
.phase{border-radius:12px;padding:14px;margin-top:12px;background:var(--panel2);border:1px solid var(--line)}
.phase.okbg{border-color:rgb(var(--ok-rgb)/.5);background:linear-gradient(180deg,rgb(var(--ok-rgb)/.10),var(--panel) 70%)}
.phase.ngbg{border-color:rgb(var(--ng-rgb)/.5);background:linear-gradient(180deg,rgb(var(--ng-rgb)/.09),var(--panel) 70%)}
.phase .head{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
.cipher{font-family:var(--f-cipher);font-size:30px;font-weight:900;letter-spacing:.18em;text-align:center;background:var(--paper);color:var(--ink);border:1px solid rgb(var(--key-rgb)/.35);border-radius:6px;padding:8px 10px;margin:8px 0;word-break:break-all;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:12px;padding:2px 9px 2px 3px;border-radius:99px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px;color:var(--sub)}
.chip.done{border-color:rgb(var(--ok-rgb)/.6);color:var(--ok)}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.word{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:8px 2px 6px;min-width:0;background:#18181a;border-color:#28282b;border-radius:7px}
.word:disabled{color:var(--text)}
.word:not(:disabled):hover{border-color:rgb(var(--key-rgb)/.5)}
.word .w{font-weight:700;font-size:12.5px;line-height:1.2;text-align:center;word-break:break-all}
.word .r{font-size:8.5px;word-break:break-all;text-align:center;color:var(--sub);line-height:1.2;margin-top:2px}
.word.sel{border-color:var(--key);background:rgb(var(--key-rgb)/.18);box-shadow:0 0 0 1px var(--key) inset}
.word.chosen{border-color:var(--ok);background:rgb(var(--ok-rgb)/.14)}
.word.past{opacity:.35}
.word.wrong{background:#111112}
.word.wrong .w{text-decoration:line-through;text-decoration-color:var(--ng);text-decoration-thickness:2px;opacity:.45}
.word.target{box-shadow:0 0 0 2px var(--send) inset;border-color:var(--send);background:rgb(var(--send-rgb)/.12)}
.badge{position:absolute;top:1px;right:5px;font-style:normal;font-size:9px;color:var(--sub);font-weight:700}
.badge.tg{color:var(--send)}
.kana{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.kt{aspect-ratio:1;padding:0;border-radius:4px;background:#1c1c1e;color:#e6e6e6;border:1px solid #303034;font-family:var(--f-cipher);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;min-width:0;box-shadow:none}
.kt:not(:disabled):hover{border-color:var(--key)}
.kt:not(:disabled):active{transform:scale(.94)}
.kt.empty{background:transparent;box-shadow:none;border:none}
.kt.used{background:#0f0f10;color:#38383c;border-color:#1a1a1c;text-decoration:line-through;box-shadow:none}
.kt.inbuf{background:#f0f0f0;color:#0b0b0c;border-color:#fff}
.buf{min-height:58px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgb(var(--key-rgb)/.04) 3px 4px);color:var(--ink);border:1px solid rgb(var(--key-rgb)/.4);border-radius:6px;padding:8px;font-family:var(--f-cipher);font-size:30px;font-weight:700;letter-spacing:.16em;margin-bottom:10px;box-shadow:inset 0 0 24px rgb(var(--key-rgb)/.08)}
.ph{font-family:var(--f-body);font-size:13px;color:#55555a;letter-spacing:.06em;font-weight:500}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:6px;margin-top:10px}
.ctrl button{padding:10px 0;font-weight:700}
.hround{border-top:1px dashed var(--line);padding:8px 0 4px}
.hround:first-of-type{border-top:none;padding-top:0}
.hhead{font-weight:700;font-size:13px}
.hatt{margin-top:6px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cchip{display:inline-block;background:var(--paper);color:var(--ink);border:1px solid rgb(var(--key-rgb)/.35);font-family:var(--f-cipher);font-weight:700;border-radius:3px;padding:0 8px;letter-spacing:.12em;font-size:14px}
.ok{color:var(--ok)}.ng{color:var(--ng)}.hid{color:var(--key)}
.plist{display:flex;flex-direction:column;gap:2px}
.pl{display:flex;align-items:center;gap:9px;font-size:14px;padding:5px 0;border-bottom:1px solid #202022}
.pl:last-child{border-bottom:none}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.4}
.pts{font-family:var(--f-disp);font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;min-width:2em;text-align:right;color:var(--key)}
.modal{position:fixed;inset:0;background:rgb(4 6 9/.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;border-top:2px solid var(--key);padding:18px 16px 28px}
.sheet ul{padding-left:1.2em;margin:6px 0}
.sheet li{margin:6px 0;font-size:14px}
.sheet li::marker{color:var(--key)}
.keys{display:flex;flex-direction:column;gap:6px}
.keyitem{text-align:left;display:flex;gap:8px;align-items:baseline;width:100%;background:#18181a;border-color:#28282b}
.keyitem .no{font-family:var(--f-mono);color:var(--sub);font-size:11px;min-width:1.6em}
.keyitem .ex{color:var(--sub);font-size:11.5px;margin-left:auto;white-space:nowrap}
.keyitem.sel{border-color:var(--key);background:rgb(var(--key-rgb)/.16)}
.keyitem.ans{border-color:var(--ok)}
.sheet .keyitem{background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1515;border:1px solid var(--ng);color:#f3d6d4;padding:9px 14px;border-radius:8px;z-index:20;font-size:13px;max-width:90vw;box-shadow:0 10px 30px -10px #000}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 3px;border-bottom:1px solid #202022;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:11px;letter-spacing:.1em}
td.num{text-align:right;font-family:var(--f-disp);font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.bigres{font-size:24px;font-weight:900;text-align:center;letter-spacing:.08em}
.foot{margin-top:18px;text-align:center}
.cipher,.kt,.buf,.cchip,.sk-cipher,.revived b{font-weight:400!important;font-synthesis:none}
.buf .ph{font-weight:500!important}
.setrow{display:flex;align-items:center;gap:12px}
.setb{width:40px;height:40px;padding:0;font-size:20px;font-weight:700;border-radius:50%}
.setn{font-family:var(--f-disp);font-size:34px;min-width:1.4em;text-align:center}
.setq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.setq .pk{padding:4px 12px}
.final-hero{text-align:center;padding:26px 0 8px}
.final-title{font-size:28px;font-weight:900;letter-spacing:.2em;margin-top:6px}
.podium{display:flex;justify-content:center;gap:18px;margin:16px 0 6px;flex-wrap:wrap}
.pod1{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod1 b{font-size:16px}
.pod1 .pts{font-size:30px;min-width:0;text-align:center}
.av.xl{width:84px;height:84px;box-shadow:0 0 0 3px var(--key)}
.rkn{font-family:var(--f-disp);font-weight:700;width:1.6em;text-align:center;color:var(--sub)}
.pl.rk1 .rkn{color:var(--key)}
.tblwrap{overflow-x:auto}
.settbl td,.settbl th{white-space:nowrap;padding:6px 6px}
.settbl td.num{font-size:15px}
.settbl td.t-send{color:var(--send)}.settbl td.t-recv{color:var(--recv)}
.rules .lead{font-size:14.5px;line-height:1.7;margin:2px 0 12px;padding:10px 12px;background:var(--panel2);border-radius:8px}
.rsec{margin-top:12px}
.rh{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--sub);margin-bottom:4px}
.rules ul,.rules ol{padding-left:1.3em;margin:0}
.rules li{margin:4px 0;font-size:13.5px;line-height:1.55}
.rules ul li .tag{margin-right:4px}
.stats{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.strow{display:grid;grid-template-columns:1fr auto 48px;align-items:center;gap:4px 10px;padding:10px 12px;background:var(--panel2);border-radius:8px}
.stl{display:flex;flex-direction:column;font-weight:700;font-size:14px}
.stl .sub{font-weight:400;font-size:11px}
.stv b{font-family:var(--f-disp);font-size:24px}
.stp{font-family:var(--f-disp);font-weight:700;font-size:16px;text-align:right}
.stbar{grid-column:1/-1;height:4px;background:#2a2a2d;border-radius:99px;overflow:hidden}
.stbar i{display:block;height:100%;background:var(--key)}
.chkrow{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;position:relative}
.chkrow input{position:absolute;opacity:0;pointer-events:none}
.chkmark{width:22px;height:22px;border-radius:5px;border:1.5px solid #5a5a60;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px;color:#0b0b0c}
.chkmark.on{background:var(--key);border-color:var(--key)}
.qwerty{display:flex;flex-direction:column;gap:5px;align-items:center}
.qrow{display:grid;gap:4px;width:100%}
.qrow.r0{grid-template-columns:repeat(10,1fr)}
.qrow.r1{grid-template-columns:repeat(9,1fr);width:90%}
.qrow.r2{grid-template-columns:repeat(7,1fr);width:70%}
.kt.qk{aspect-ratio:auto;height:44px;font-size:18px}
.ctrl.ctrl-a{grid-template-columns:1fr 1.4fr}
.ctrl.ctrl-a button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.buf.alpha{letter-spacing:.22em}
.moderow{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.seg button{display:flex;flex-direction:column;align-items:center;padding:8px 4px;font-weight:700;font-size:13px;background:transparent}
.seg button small{font-weight:400;font-size:10.5px;color:var(--sub)}
.seg button.on{background:#f0f0f0;color:#0b0b0c;border-color:#fff}
.seg button.on small{color:#555}
.netbar{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--ng);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:7px 10px;letter-spacing:.04em;animation:nb 1.2s ease-in-out infinite alternate}
@keyframes nb{to{opacity:.75}}
.kpc{padding:11px 12px;align-items:center}
.kpc:hover{border-color:rgb(var(--key-rgb)/.6);background:rgb(var(--key-rgb)/.08)}
.kpn{display:flex;flex-direction:column;gap:1px}
.kpn b{font-size:15px}
.rmbot{padding:3px 6px;font-size:12px;color:var(--ng);background:transparent;border-color:transparent;line-height:1}
.ktag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;flex:none;align-self:center;white-space:nowrap;letter-spacing:.06em}
.kt-m{background:rgb(var(--send-rgb)/.16);color:var(--send)}
.kt-i{background:rgb(var(--ok-rgb)/.16);color:var(--ok)}
.sticky{position:sticky;top:0;z-index:6;margin:10px -16px 0;padding:10px 16px 12px;background:rgb(11 11 12/.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 10px 24px -12px #000}
.sk-row{display:flex;align-items:center;gap:12px}
.sk-ci{flex:1;min-width:0}
.sk-lb{font-size:10.5px;color:var(--sub);margin-bottom:4px;letter-spacing:.24em}
.sk-cipher{font-family:var(--f-cipher);font-size:30px;font-weight:700;letter-spacing:.18em;background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgb(var(--key-rgb)/.05) 3px 4px);color:var(--ink);border:1px solid rgb(var(--key-rgb)/.45);border-radius:5px;padding:4px 10px;text-align:center;word-break:break-all;line-height:1.3;box-shadow:0 6px 16px -8px #000}
.sk-kg{font-size:19px;font-weight:900;color:var(--key);letter-spacing:.04em}
.sk-time{width:78px;height:78px;border-radius:50%;border:3px solid var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1;background:#111112;box-shadow:none}
.sk-time span{font-family:var(--f-disp);font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text)}
.sk-time small{font-size:9.5px;color:var(--sub);margin-top:1px;letter-spacing:.2em}
.sk-time.hurry{border-color:var(--ng);box-shadow:none;animation:pulse 1s ease-in-out infinite}
.sk-time.hurry span{color:var(--ng)}
@keyframes pulse{50%{transform:scale(1.07)}}
.sk-bar{height:4px;background:#1f1f22;border-radius:99px;margin-top:10px;overflow:hidden}
.sk-bar i{display:block;height:100%;width:100%;background:var(--key);transition:width .2s linear}
.sticky.hurry .sk-bar i{background:var(--ng)}
.sk-res{display:flex;flex-direction:column;align-items:center;font-size:30px;flex:none;width:78px}
.sk-res.ok{color:var(--ok)}.sk-res.ng{color:var(--ng)}
.sk-res small{font-size:11px;font-weight:700;letter-spacing:.06em}
.pkrow{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:14px}
.pkrow>.tag{margin-top:6px}
.pkchips{display:flex;flex-wrap:wrap;gap:5px}
.pk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px 3px 3px;border-radius:99px;background:#18181a}
.pk:first-child{padding-left:10px}
.pk.on{border-color:var(--key);background:rgb(var(--key-rgb)/.16);color:var(--key)}
.pk:disabled{opacity:.25}
.av{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#222225;flex:none;overflow:hidden;box-shadow:0 0 0 1px #333337}
.av.md{width:30px;height:30px}.av.lg{width:46px;height:46px;box-shadow:0 0 0 2px rgb(var(--key-rgb)/.35)}
.avs{width:100%;height:100%;display:block}
.who{display:inline-flex;align-items:center;gap:5px}
.lround{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-top:10px;background:#111112}
.lround:first-child{margin-top:0}
.lround.done{opacity:.8}
.lrh{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}

 const a=[...h];let out='';
 for(let i=0;i<a.length;i++){

 }

const toHira=t=>[...t].map(c=>{const n=c.charCodeAt(0);return n>=0x30A1&&n<=0x30F6?String.fromCharCode(n-0x60):c;}).join('');
WORDS.forEach(w=>{w.y=w.r||toHira(w.w);});
const ASSOC={};ASSOC_SRC.trim().split('\n').forEach(l=>{const [w,a]=l.split(':');ASSOC[w]=a.split(',');});
const VOCAB=[...new Set([...WORDS.map(w=>w.y),...Object.values(ASSOC).flat()])];
const SUFFIX=['ずき','のえ','ごっこ'];
const kc=t=>[...t].filter(c=>c!=='ー');
const kFirst=t=>norm(kc(t)[0]||'');
const kLast=t=>{const a=kc(t);return norm(a[a.length-1]||'');};
const kRow=c=>KANA_ROWS.findIndex(r=>r.includes(norm(c)));
function keyRule(k,r,w){
 if(!w||w===r)return false;
 const a=kc(r),b=kc(w);
 switch(k){
 case 0:return kFirst(w)===kFirst(r);
 case 1:return kFirst(w)===kFirst(r)&&a.length===b.length;
 case 2:return a.length>1&&b.length>1&&norm(a[1])===norm(b[1]);
 case 3:return kLast(w)===kLast(r);
 case 4:return kFirst(w)===kLast(r);
 case 5:return kLast(w)===kFirst(r);
 case 6:return kRow(kFirst(w))===kRow(kFirst(r));
 case 7:{const S=new Set(a.map(norm));return new Set(b.map(norm).filter(c=>S.has(c))).size>=2;}
 case 8:return a.length===b.length&&a.filter((c,i)=>c!==b[i]).length===1;
 case 9:return w.includes(r);
 }
 return false;
}
let ROMA_IDX=null;
function romaIdx(){if(ROMA_IDX)return ROMA_IDX;ROMA_IDX={};for(const v of VOCAB){const r=toRoma(v);(ROMA_IDX[r]=ROMA_IDX[r]||[]).push(v);}return ROMA_IDX;}
function cipherFits(k,wordIdx,cipher,alpha){
 const w=WORDS[wordIdx];
 if(alpha){
  const C=String(cipher).toUpperCase();
  if(k<10){if(k===9&&SUFFIX.some(sx=>toRoma(w.y+sx)===C))return true;return (romaIdx()[C]||[]).some(v=>keyRule(k,w.y,v));}
  return (ASSOC[w.w]||[]).some(a=>toRoma(a)===C);
 }
 if(k<10)return keyRule(k,w.y,cipher);
 return (ASSOC[w.w]||[]).includes(cipher);
}

function pickWords(g){
 const av=shuffle([...WORDS.keys()].filter(i=>!g.seen.includes(i)));
 g.words=av.slice(0,WN);g.seen.push(...g.words);
 g.target=g.words[rint(WN)];g.targets.push(g.target);
}
function pById(id){return H.players.find(p=>p.id===id);}
function isOn(id){const p=pById(id);return !!(p&&p.online);}
function interceptors(g){return g.members.filter(id=>id!==g.senderId&&id!==g.receiverId);}
function answerers(g){return [g.receiverId,...interceptors(g).filter(id=>!g.solvedRound.includes(id))];}
function pending(list,done){return list.filter(id=>!(id in done)&&isOn(id));}
function setT(ms,fn){clearT();hostTimer=setTimeout(fn,ms);}

function startGame(){
 const ps=H.players.filter(p=>p.online);
 if(ps.length<3){sendErr(myId,'3人以上必要です');return;}
 let sender=H.pick.s?ps.find(p=>p.id===H.pick.s):null;
 let receiver=H.pick.r?ps.find(p=>p.id===H.pick.r):null;
 if(sender&&sender===receiver)receiver=null;
 if(!sender){const pool=ps.filter(p=>p!==receiver);const min=Math.min(...pool.map(p=>p.sent));sender=shuffle(pool.filter(p=>p.sent===min))[0];}
 if(!receiver)receiver=shuffle(ps.filter(p=>p!==sender))[0];
 H.pick={s:null,r:null};H.match.cur++;
 sender.sent++;
 H.gameNo++;
 H.game={senderId:sender.id,receiverId:receiver.id,members:shuffle(ps.map(p=>p.id)),key:null,keyChoices:shuffle([...KEYS.keys()]).slice(0,4),
  seen:[],words:[],target:-1,targets:[],alpha:!!(H.settings&&H.settings.alpha),
  round:0,used:[],rounds:[[]],solved:{},solvedRound:[],answers:{},curCipher:'',deadline:0,keyGuesses:{},revealOk:false,lost:false,result:null,revived:[]};
 pickWords(H.game);

function checkCipher(text,used,alpha){
 const seen=[];
 for(const c of [...text]){
  const b=baseOf(c,alpha);
  if(alpha&&!ALPHA.includes(b))return {err:'アルファベット以外は使えません'};
  if(!alpha&&!KANA.includes(b))return {err:'ひらがな以外は使えません'};
  if(used.includes(b))return {err:'「'+b+'」は使用済みです'};
  if(seen.includes(b))return {err:'「'+b+'」が重複しています'};
  seen.push(b);
 }
 if(!seen.length)return {err:'1文字以上必要です'};
 return {bases:seen};
}

function endAnswer(){
 const g=H.game;if(!g||H.phase!=='answer')return;clearT();
 const t=g.target,res={};
 for(const id of answerers(g)){
  const a=(id in g.answers)?g.answers[id]:null,ok=a===t;
  res[id]={ans:a,ok};
  if(ok&&id!==g.receiverId){g.solvedRound.push(id);g.solved[id]=(g.solved[id]||0)+1;}
 }
 g.rounds[g.round].push({cipher:g.curCipher,res});
 g.revealOk=res[g.receiverId].ok;
 if(!g.revealOk&&g.used.length>=CS(g).length)g.lost=true;
 H.phase='reveal';broadcast();
 setT(g.revealOk?5500:4200,afterReveal);
}
function afterReveal(){
 const g=H.game;if(!g||H.phase!=='reveal')return;
 if(g.lost){toKey();return;}
 if(g.revealOk){g.round++;g.solvedRound=[];if(g.round>=3){toKey();return;}
  const back=shuffle(g.used.slice()).slice(0,Math.floor(g.used.length/2));
  g.used=g.used.filter(c=>!back.includes(c));g.revived=back;pickWords(g);g.rounds.push([]);}
 g.revealOk=false;H.phase='compose';broadcast();
}
function toKey(){const g=H.game;g.keyGuesses={};H.phase='keyguess';g.deadline=Date.now()+KEY_MS;setT(KEY_MS,finishGame);broadcast();}
function toFinal(){clearT();H.phase='final';broadcast();}
function finishGame(){
 const g=H.game;if(!g||H.phase!=='keyguess')return;clearT();
 const inter=interceptors(g);
 const right=inter.filter(id=>g.keyGuesses[id]===g.key).length,wrong=inter.length-right;
 const pairPts=g.lost?0:wrong-right,scores={};
 scores[g.senderId]=pairPts;scores[g.receiverId]=pairPts;
 for(const id of inter)scores[id]=(g.solved[id]||0)*(g.keyGuesses[id]===g.key?2:1);
 for(const id in scores){const p=pById(id);if(p)p.total+=scores[id];}
 g.result={scores,right,wrong,pairPts};
 H.match.hist.push({set:H.match.cur,s:g.senderId,r:g.receiverId,lost:g.lost,scores:Object.assign({},scores)});
 H.phase='result';broadcast();
 if(H.match.cur>=H.match.sets)setT(12000,()=>{if(H.phase==='result')toFinal();});
}
function viewFor(pid){
 const v={phase:H.phase,me:pid,host:pid===myId,gameNo:H.gameNo,match:JSON.parse(JSON.stringify(H.match)),settings:Object.assign({hide:false,alpha:false},H.settings),test:testMode,code:roomCode,pick:Object.assign({},H.pick),
  players:H.players.map(p=>({id:p.id,name:p.name,a:p.a,total:p.total,online:p.online,bot:p.bot}))};
 const g=H.game;if(!g)return v;
 const role=pid===g.senderId?'sender':pid===g.receiverId?'receiver':g.members.includes(pid)?'inter':'spec';
 const fin=H.phase==='result',pair=role==='sender'||role==='receiver',live=H.phase==='answer'||H.phase==='keyguess'||H.phase==='keypick';
 v.g={role,senderId:g.senderId,receiverId:g.receiverId,members:g.members,
  key:(pair||fin)?g.key:null,
  words:g.words.map(i=>WORDS[i]),wordIds:g.words.slice(),
  round:g.round,used:g.used.slice(),alpha:!!g.alpha,
  target:(role==='sender'&&['keypick','compose','answer','reveal'].includes(H.phase))?g.target:null,
  history:g.rounds.map((atts,r)=>{
   const done=r<g.round||fin||(r===g.round&&H.phase==='reveal'&&g.revealOk);
   const knows=fin||pair||!(H.settings&&H.settings.hide)||atts.some(a=>a.res[pid]&&a.res[pid].ok);
   return {done,
   target:(done&&knows)?g.targets[r]:null,
   atts:atts.map(a=>{const res={};for(const id in a.res){const x=a.res[id];res[id]={ok:x.ok,ans:(x.ok&&id!==pid&&!fin&&(id!==g.receiverId||!knows))?-1:x.ans};}return {cipher:a.cipher,res};})
  };}),
  cipher:H.phase==='answer'?g.curCipher:null,
  answerers:H.phase==='answer'?answerers(g):H.phase==='keyguess'?interceptors(g):[],
  answered:H.phase==='answer'?Object.keys(g.answers):H.phase==='keyguess'?Object.keys(g.keyGuesses):[],
  myAnswer:(H.phase==='answer'&&pid in g.answers)?g.answers[pid]:null,
  myKey:(pid in g.keyGuesses)?g.keyGuesses[pid]:null,
  solved:Object.assign({},g.solved),solvedRound:g.solvedRound.slice(),
  remain:live?Math.max(0,g.deadline-Date.now()):null,total:H.phase==='keyguess'?KEY_MS:H.phase==='keypick'?KPICK_MS:ANSWER_MS,
  keyChoices:(role==='sender'&&H.phase==='keypick')?g.keyChoices.slice():null,
  revealOk:g.revealOk,lost:g.lost,
  revived:(H.phase==='compose'&&g.rounds[g.round].length===0)?g.revived.slice():[],
  result:fin?Object.assign({},g.result,{keyGuesses:Object.assign({},g.keyGuesses),targets:g.targets.slice()}):null
 };
 return v;
}

function hostRecv(peerId,d,c){
 if(!d||typeof d!=='object')return;
 const pid=alias[peerId]||peerId;
 if(d.t==='join'){
  const name=String(d.name||'').trim().slice(0,10)||'名無し',tok=String(d.tok||'');
  const back=(tok&&H.players.find(p=>!p.bot&&p.tok===tok&&p.id!==myId))||H.players.find(p=>!p.online&&!p.bot&&p.name===name);
  if(back){
   const old=conns[back.id];alias[peerId]=back.id;conns[back.id]=c;back.online=true;if(tok)back.tok=tok;
   if(old&&old!==c){try{old.close();}catch(e){}}
   broadcast();return;}
  if(!(H.phase==='wait'||H.phase==='result'||H.phase==='final')){c.send({t:'err',msg:'ゲーム進行中です。終了後に参加してください'});return;}
  if(H.players.length>=10){c.send({t:'err',msg:'満員です（最大10人）'});return;}
  conns[peerId]=c;addPlayer(peerId,name,false);pById(peerId).tok=tok;broadcast();return;
 }
 if(!pById(pid))return;

function hostDrop(c){
 const pid=alias[c.peer]||c.peer;
 if(conns[pid]!==c)return;
 delete conns[pid];
 const p=pById(pid);if(!p)return;
 if(H.phase==='wait'){H.players=H.players.filter(x=>x!==p);if(H.pick.s===pid)H.pick.s=null;if(H.pick.r===pid)H.pick.r=null;}else p.online=false;
 const g=H.game;
 if(g&&H.phase==='answer'&&!pending(answerers(g),g.answers).length){endAnswer();return;}
 if(g&&H.phase==='keyguess'&&!pending(interceptors(g),g.keyGuesses).length){finishGame();return;}
 broadcast();
}

/* ===== BOT（TESTルーム） ===== */
const botDone=new Set();
function scheduleBots(){
 if(!H.game)return;
 const g=H.game,bots=H.players.filter(p=>p.bot).map(p=>p.id);
 const tag=H.gameNo+'-'+H.phase+'-'+g.round+'-'+(g.rounds[g.round]?g.rounds[g.round].length:0)+'-';
 const once=(id,ms,fn)=>{if(botDone.has(tag+id))return;botDone.add(tag+id);setTimeout(fn,ms);};
 if(H.phase==='keypick'&&bots.includes(g.senderId))once(g.senderId,1500+rint(2000),()=>handleAction(g.senderId,{t:'keypick',k:g.keyChoices[rint(4)]}));
 if(H.phase==='compose'&&bots.includes(g.senderId))once(g.senderId,1800,()=>botCipher(g.senderId));
 if(H.phase==='answer')for(const id of answerers(g))if(bots.includes(id))once(id,1500+rint(6000),()=>botAnswer(id));
 if(H.phase==='keyguess')for(const id of interceptors(g))if(bots.includes(id))once(id,1500+rint(5000),()=>handleAction(id,{t:'keyguess',i:Math.random()<0.3?g.key:rint(KEYS.length)}));
}
function botCipher(id){
 const g=H.game;if(!g||H.phase!=='compose')return;
 const tw=WORDS[g.target],A=!!g.alpha,conv=t=>A?toRoma(t):t,ok=t=>t&&!checkCipher(t,g.used,A).err;
 const pick=list=>{let v=[...new Set(list.map(conv))].filter(ok);if(!v.length)return null;
  const len=x=>A?x.length:kc(x).length;
  const multi=v.filter(x=>len(x)>=2);if(multi.length)v=multi;
  v.sort((x,y)=>len(x)-len(y));return shuffle(v.slice(0,5))[0];};
 let text=null;
 if(g.key<10){
  const c=VOCAB.filter(w=>keyRule(g.key,tw.y,w));
  if(g.key===9)c.push(...SUFFIX.map(sx=>tw.y+sx));
  text=pick(c);
 }
 if(!text)text=pick(ASSOC[tw.w]||[]);
 if(!text)text=pick(VOCAB);
 if(!text){const av=shuffle(CS(g).filter(k=>!g.used.includes(k)));text=av.slice(0,Math.min(av.length,2)).join('');}
 handleAction(id,{t:'cipher',text});
}
function botAnswer(id){
 const g=H.game;if(!g||H.phase!=='answer'||id in g.answers)return;
 const t=g.target,n=g.rounds[g.round].length,tried=new Set();
 g.rounds[g.round].forEach(a=>{for(const k in a.res){const x=a.res[k];if(!x.ok&&x.ans!=null)tried.add(x.ans);}});
 const rest=[...Array(WN).keys()].filter(x=>!tried.has(g.words[x]));
 let i;
 if(id===g.receiverId){
  const fit=rest.filter(x=>cipherFits(g.key,g.words[x],g.curCipher,g.alpha));
  if(fit.length&&Math.random()<0.9)i=fit[rint(fit.length)];
 }
 if(i==null){
  const p=id===g.receiverId?Math.min(0.8,0.3+0.2*n):0.12+0.05*n;
  i=Math.random()<p?g.words.indexOf(t):rest[rint(rest.length)];
 }
 handleAction(id,{t:'answer',i});
}

let netState='ok',retryTimer=null,joinInfo=null;
function setNet(st){if(netState===st)return;netState=st;const b=document.getElementById('netbar');if(b)b.remove();
 if(st!=='ok'){const d=document.createElement('div');d.id='netbar';d.className='netbar';d.textContent=st==='host'?'接続を復旧しています…（ホスト）':'接続が切れました。再接続しています…';document.body.appendChild(d);}}
function saveJoin(){try{localStorage.setItem('angoJoin',JSON.stringify({t:Date.now(),code:roomCode,name:joinInfo.name}));}catch(e){}}
function hostRoom(name,code,restore){
 if(typeof Peer==='undefined'){lmsg('通信ライブラリを読み込めませんでした');return;}
 lmsg(restore?'ルームを復旧中…':'ルームを作成中…');
 let tries=0;
 const open=()=>{
  peer=new Peer(PREFIX+code);
  peer.on('open',id=>{
   myId=id;isHost=true;roomCode=code;
   if(restore){restoreHost(restore);}else{H=newHost();addPlayer(id,name,false);pById(id).tok=myTok;}
   setNet('ok');broadcast();
  });
  peer.on('connection',c=>{c.on('data',d=>hostRecv(c.peer,d,c));c.on('close',()=>hostDrop(c));c.on('error',()=>hostDrop(c));});
  peer.on('disconnected',()=>{if(peer&&!peer.destroyed){setNet('host');setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);}});
  peer.on('open',()=>setNet('ok'));
  peer.on('error',e=>{
   if(e.type==='unavailable-id'){
    if(restore&&tries<20){tries++;try{peer.destroy();}catch(_){}lmsg('ルームを復旧中…（'+tries+'）');setTimeout(open,3000);return;}
    lmsg('そのルームコードは使用中です');return;}
   if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){setNet('host');setTimeout(()=>{try{peer.reconnect();}catch(_){}},2000);return;}
   if(!V)lmsg('接続エラー: '+e.type);
  });
 };
 open();
}
function restoreHost(sv){
 H=sv.H;botSeq=sv.botSeq||0;if(!H.match)H.match={sets:3,cur:0,hist:[]};if(!H.settings)H.settings={hide:false,alpha:false};
 for(const p of H.players)if(!p.bot&&p.id!==myId)p.online=false;
 const me=pById(myId);if(me){me.online=true;me.tok=myTok;}
 const g=H.game,left=g?Math.max(3000,(g.deadline||0)-Date.now()):0;
 if(g&&H.phase==='answer')setT(left,endAnswer);
 else if(g&&H.phase==='keyguess')setT(left,finishGame);
 else if(g&&H.phase==='keypick')setT(left,()=>{if(H.game&&H.phase==='keypick')setKey(H.game.keyChoices[rint(4)]);});
 else if(g&&H.phase==='reveal')setT(2500,afterReveal);
 else if(H.phase==='result'&&H.match&&H.match.cur>=H.match.sets)setT(8000,()=>{if(H.phase==='result')toFinal();});
 if(g&&['answer','keyguess','keypick'].includes(H.phase))g.deadline=Date.now()+left;
}
function joinRoom(name,code){
 if(typeof Peer==='undefined'){lmsg('通信ライブラリを読み込めませんでした');return;}
 lmsg('接続中…');
 joinInfo={name,code};roomCode=code;saveJoin();
 const connect=()=>{
  if(hostConn){try{hostConn.close();}catch(e){}}
  const c=peer.connect(PREFIX+code,{reliable:true});hostConn=c;
  c.on('open',()=>{c.send({t:'join',name,tok:myTok});setNet('ok');clearTimeout(retryTimer);retryTimer=null;});
  c.on('data',d=>{if(c!==hostConn)return;if(d.t==='view'){applyView(d.v);saveJoin();}else if(d.t==='err'){if(!V)lmsg(d.msg);else toast(d.msg);}});
  c.on('close',()=>{if(c===hostConn)lost();});
  c.on('error',()=>{if(c===hostConn)lost();});
 };
 const lost=()=>{
  if(!V){return;}
  setNet('lost');
  if(retryTimer)return;
  retryTimer=setTimeout(function again(){
   retryTimer=null;
   if(hostConn&&hostConn.open){setNet('ok');return;}
   if(!peer||peer.destroyed){startPeer();}
   else if(peer.disconnected){try{peer.reconnect();}catch(e){}}
   else connect();
   retryTimer=setTimeout(again,3000);
  },1500);
 };
 const startPeer=()=>{
  peer=new Peer();
  peer.on('open',id=>{myId=myId||id;connect();});
  peer.on('disconnected',()=>{lost();});
  peer.on('error',e=>{
   if(e.type==='peer-unavailable'){if(!V)lmsg('ルームが見つかりません');else lost();return;}
   if(!V)lmsg('接続エラー: '+e.type);else lost();
  });
 };
 startPeer();
 window.addEventListener('online',()=>{if(V)lost();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&V&&!(hostConn&&hostConn.open))lost();});
}
function act(a){if(isHost)handleAction(myId,a);else if(hostConn&&hostConn.open)hostConn.send(a);else toast('再接続中です。少し待ってからもう一度操作してください');}

const STAT0={matches:0,wins:0,ansRounds:0,ansOk:0,keyTries:0,keyHits:0,pairSets:0,perfect:0,sets:0};
function loadStats(){try{return Object.assign({},STAT0,JSON.parse(localStorage.getItem('angoStats')||'{}'));}catch(e){return Object.assign({},STAT0);}}
function saveStats(st){try{localStorage.setItem('angoStats',JSON.stringify(st));}catch(e){}}
function markDone(k){let d=[];try{d=JSON.parse(localStorage.getItem('angoStatDone')||'[]');}catch(e){}if(d.includes(k))return false;d.push(k);if(d.length>200)d=d.slice(-200);try{localStorage.setItem('angoStatDone',JSON.stringify(d));}catch(e){}return true;}
function recordStats(v){
 const g=v.g,M=v.match;if(!M||!M.id)return;
 const base=v.code+'-'+M.id;
 if(v.phase==='result'&&g&&g.result&&g.role!=='spec'){
  if(!markDone(base+'-s'+M.cur))return;
  const st=loadStats(),me=v.me,r=g.result;st.sets++;
  if(g.role==='receiver'||g.role==='inter'){
   g.history.forEach(h=>{if(!h.atts.length)return;st.ansRounds++;if(h.atts.some(a=>a.res[me]&&a.res[me].ok))st.ansOk++;});
  }
  if(g.role==='inter'){st.keyTries++;if(r.keyGuesses[me]===g.key)st.keyHits++;}
  if(g.role==='sender'||g.role==='receiver'){st.pairSets++;if(!g.lost&&r.right===0)st.perfect++;}
  saveStats(st);
 }
 if(v.phase==='final'&&v.players.some(p=>p.id===v.me)&&M.hist.some(h=>v.me in h.scores)){
  if(!markDone(base+'-final'))return;
  const st=loadStats(),mx=Math.max(...v.players.map(p=>p.total)),mine=v.players.find(p=>p.id===v.me);
  st.matches++;if(mine&&mine.total===mx)st.wins++;saveStats(st);
 }
}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—';}

 return `<div class="modal" data-act="close"><div class="sheet" data-stop="1"><h3>戦績 <button class="ghost small" data-act="close">閉じる</button></h3>
 <div class="stats">
 ${row('対戦数',st.matches,null,' 戦','最終結果まで遊んだ回数')}
 ${row('優勝',st.wins,st.matches,' 戦','同点優勝を含む')}

function renderLobby(){
 let saved='';try{saved=localStorage.getItem('angoName')||'';}catch(e){}
 $app.innerHTML=`<div class="hero"><span class="stamp">極秘</span><div class="logo">ANGO</div><div class="cls">CLASSIFIED · CIPHER PARTY GAME</div><div class="tagline">鍵を知る相手にだけ、言葉を届けろ。</div></div>
 <div class="card">
 <label>名前<input id="nm" maxlength="10" value="${esc(saved)}" placeholder="10文字まで"></label>
 <label>ルームコード<input id="rc" maxlength="8" placeholder="作成時は空欄で自動" autocapitalize="characters"></label>
 <button class="primary big" data-act="create">ルームを作る</button>
 <button class="big" data-act="join">ルームに参加</button>
 <div class="err" id="lmsg"></div>
 <div class="note center">コードに「TEST」と入れるとBOTとソロテスト</div>
 </div>${resumeHtml()}
 <div class="foot"><button class="ghost" data-act="rules">ルールを読む</button> <button class="ghost" data-act="stats">戦績</button></div>${modalHtml()}`;
}
function render(){
 if(!V){renderLobby();return;}
 if(V.phase==='final'){$app.innerHTML=finalHtml()+modalHtml();return;}
 if(V.phase==='wait'||!V.g){$app.innerHTML=waitHtml()+modalHtml();return;}
 $app.innerHTML=gameHtml()+modalHtml();
 tickTimer();
}
function topBar(extra){
 return `<div class="top"><div class="logo">ANGO</div><div style="display:flex;gap:6px;align-items:center">${extra||''}<button class="ghost small" data-act="keys">${IC.key} 鍵</button><button class="ghost small" data-act="rules">ルール</button></div></div>`;
}
function botBtn(){
 if(!V.host)return '';
 const full=V.players.length>=10;
 return `<button class="big" data-act="addbot" ${full?'disabled':''}>＋ BOTを追加${full?'（満員）':''}</button>`;
}
function pickerHtml(){
 const ps=V.players.filter(p=>p.online),pk=V.pick||{};
 const row=(role,label,cls)=>{
  const cur=pk[role],other=pk[role==='s'?'r':'s'];
  if(!V.host)return `<div class="pkrow"><span class="tag ${cls}">${label}</span>${cur?who(cur):'<span class="sub">おまかせ（ランダム）</span>'}</div>`;
  return `<div class="pkrow"><span class="tag ${cls}">${label}</span><div class="pkchips"><button class="pk ${!cur?'on':''}" data-act="pick" data-role="${role}" data-id="">おまかせ</button>${ps.map(p=>`<button class="pk ${cur===p.id?'on':''}" data-act="pick" data-role="${role}" data-id="${esc(p.id)}" ${other===p.id?'disabled':''}>${av(p.id)}${esc(p.name)}</button>`).join('')}</div></div>`;
 };
 return `<div class="card"><h3>次のセットの役割</h3>${row('s','送信者','t-send')}${row('r','受信者','t-recv')}${V.host?'<div class="note">選ばなかった役割はランダムで決まります</div>':''}</div>`;
}
function modeHtml(){
 const a=V.settings.alpha;
 if(!V.host)return `<div class="moderow"><span class="sub">文字</span><b>${a?'アルファベット版：アルファベット(26文字)':'ひらがな版：五十音(47文字)'}</b></div>`;
 return `<div class="moderow"><span class="sub">文字</span><div class="seg"><button class="${a?'':'on'}" data-act="alpha" data-on="0">ひらがな版<small>五十音(47文字)</small></button><button class="${a?'on':''}" data-act="alpha" data-on="1">アルファベット版<small>アルファベット(26文字)</small></button></div></div>`;
}
function hideHtml(){
 const on=V.settings.hide;
 const body=`<span class="chkmark ${on?'on':''}">${on?IC.ok:''}</span><span>受信者が当てた正解をスパイに伏せる<br><span class="sub">${on?'オン：正解は当てた人と送信者・受信者だけに見える':'オフ：受信者が当てると全員に正解が公開される'}</span></span>`;
 if(!V.host)return `<div class="chkrow">${body}</div>`;
 return `<label class="chkrow"><input type="checkbox" data-act="hide" ${on?'checked':''}>${body}</label>`;
}
function setsHtml(){
 const n=V.match.sets;
 if(!V.host)return `<div class="card"><h3>ルーム設定</h3><div class="setrow"><b class="setn">${n}</b><span class="sub">セット（1セット＝3ラウンド・ペアは毎セット交代）</span></div>${modeHtml()}${hideHtml()}</div>`;
 return `<div class="card"><h3>ルーム設定</h3><div class="setrow"><button class="setb" data-act="sets" data-n="${n-1}" ${n<=1?'disabled':''}>−</button><b class="setn">${n}</b><button class="setb" data-act="sets" data-n="${n+1}" ${n>=10?'disabled':''}>＋</button><span class="sub">セット<br>1セット＝3ラウンド</span></div>
 <div class="setq">${[1,2,3,5].map(k=>`<button class="pk ${k===n?'on':''}" data-act="sets" data-n="${k}">${k}</button>`).join('')}<button class="pk ${n===V.players.length?'on':''}" data-act="sets" data-n="${Math.min(10,V.players.length)}">全員1回ずつ（${Math.min(10,V.players.length)}）</button></div>
 <div class="note">ペアは毎セット交代。送信者はなるべく全員に回るように選ばれます</div>${modeHtml()}${hideHtml()}</div>`;
}
function waitHtml(){
 const n=V.players.filter(p=>p.online).length;
 return topBar()+`<div class="card center"><div class="sub">ルームコード</div><div class="code">${esc(V.code)}</div><div class="sub">${V.test?'BOTとのテストルーム':'このコードを伝えて参加してもらおう'}</div></div>
 <div class="card"><h3>参加者 ${n}人</h3>${playerList()}</div>
 ${botBtn()}
 ${setsHtml()}
 ${V.host?`<button class="primary big" data-act="start" ${n<3?'disabled':''}>ゲーム開始（全${V.match.sets}セット）</button><div class="note center">3〜10人で遊べます（BOTを含む）</div>`:'<div class="note center" style="margin-top:14px">ホストの開始を待っています</div>'}`;
}
function playerList(){
 const g=V.g;
 return `<div class="plist">${V.players.map(p=>{
  let tag='';
  if(g&&V.phase!=='wait'){
   if(p.id===g.senderId)tag='<span class="tag t-send">送信者</span>';
   else if(p.id===g.receiverId)tag='<span class="tag t-recv">受信者</span>';
   else if(g.members.includes(p.id))tag=`<span class="tag t-inter">スパイ ${g.solved[p.id]||0}解読</span>`;
  }
  const done=g&&g.solvedRound.includes(p.id)&&V.phase!=='result'?`<span class="hid">${IC.lock}</span>`:'';
  const canPick=p.id===V.me&&(V.phase==='wait'||V.phase==='result'||V.phase==='final');
  return `<div class="pl ${p.online?'':'off'}">${canPick?`<button class="avbtn" data-act="avmodal">${av(p.id,'md')}<span>変更</span></button>`:av(p.id,'md')}<span class="nm">${esc(p.name)}${p.id===V.me?' <span class="sub">(あなた)</span>':''}${p.online?'':' <span class="sub">切断</span>'}</span>${done}${tag}<span class="pts">${p.total}</span>${p.bot&&V.host&&(V.phase==='wait'||V.phase==='result'||V.phase==='final')?`<button class="rmbot" data-act="rmbot" data-id="${esc(p.id)}" aria-label="BOTを外す">${IC.ng}</button>`:''}</div>`;
 }).join('')}</div>`;
}
function roleCard(g){
 const r=g.role;
 let h=`<div class="card"><div class="pair"><span class="tag t-send">送信者</span>${who(g.senderId)}<span class="sub">${IC.arrow}</span><span class="tag t-recv">受信者</span>${who(g.receiverId)}</div>`;
 const meAv=`<span style="display:flex;align-items:center;gap:8px;margin-top:8px">${av(V.me,'lg')}`;
 if(r==='sender')h+=`${meAv}<span class="role t-send">あなたは送信者</span></span>`;
 else if(r==='receiver')h+=`${meAv}<span class="role t-recv">あなたは受信者</span></span>`;
 else if(r==='inter')h+=`${meAv}<span><span class="role">あなたはスパイ</span><br><span class="sub">暗号と履歴から、単語と鍵を推理しよう</span></span></span>`;
 else h+=`${meAv}<span class="role">観戦中</span></span>`;
 if(g.key!=null&&V.phase!=='result')h+=`<div class="keybox">${IC.key}<div><div class="sub">鍵</div>${ktag(KEYS[g.key])} <b>${esc(KEYS[g.key].n)}</b> <span class="sub">例：${esc(KEYS[g.key].ex)}</span></div></div>`;
 if(g.target!=null)h+=`<div class="tgbox">${IC.eye}<div><div class="sub" style="color:inherit">伝える単語</div><b>${esc(wordLabel(g,g.target))}</b></div></div>`;
 return h+'</div>';
}
function timerHtml(){return '';}
function stickyHtml(g){
 const ph=V.phase;
 if(ph==='keypick')return `<div class="sticky" id="sticky"><div class="sk-row"><div class="sk-ci"><div class="sk-lb">準備中</div><div class="sk-kg">${IC.key} ${g.role==='sender'?'鍵を選んでください':'送信者が鍵を選んでいます'}</div></div><div class="sk-time" id="timerBox"><span id="timer">--</span><small>秒</small></div></div><div class="sk-bar"><i id="timerBar"></i></div></div>`;
 const tm=()=>`<div class="sk-time" id="timerBox"><span id="timer">--</span><small>秒</small></div>`;
 const bar='<div class="sk-bar"><i id="timerBar"></i></div>';
 if(ph==='answer')return `<div class="sticky" id="sticky"><div class="sk-row"><div class="sk-ci"><div class="sk-lb">暗号</div><div class="sk-cipher">${esc(g.cipher)}</div></div>${tm()}</div>${bar}</div>`;
 if(ph==='reveal'){const h=g.history[g.round],a=h.atts[h.atts.length-1];
  return `<div class="sticky"><div class="sk-row"><div class="sk-ci"><div class="sk-lb">暗号</div><div class="sk-cipher">${esc(a.cipher)}</div></div><div class="sk-res ${g.revealOk?'ok':'ng'}">${g.revealOk?IC.ok+'<small>受信成功</small>':IC.ng+'<small>受信失敗</small>'}</div></div></div>`;}
 if(ph==='keyguess')return `<div class="sticky" id="sticky"><div class="sk-row"><div class="sk-ci"><div class="sk-lb">最終推理</div><div class="sk-kg">${IC.key} 鍵はどれ？</div></div>${tm()}</div>${bar}</div>`;
 return '';
}
function phaseHtml(g){
 const me=V.me,ph=V.phase;
 const waitChips=()=>`<div class="chips">${g.answerers.map(id=>`<span class="chip ${g.answered.includes(id)?'done':''}">${av(id)}${esc(pname(id))}${g.answered.includes(id)?IC.ok:''}</span>`).join('')}</div>`;
 if(ph==='keypick'){
  if(g.role==='sender')return `<div class="phase"><div class="head">${IC.key} 今回の鍵を選ぶ</div><div class="sub">4つの候補から1つ選ぼう。選んだ鍵は受信者にだけ伝わり、3ラウンド共通で使う。時間切れならランダムで決まる。</div><div class="keys" style="margin-top:8px">${g.keyChoices.map(k=>`<button class="keyitem kpc" data-act="kpick" data-k="${k}">${ktag(KEYS[k])}<span class="kpn"><b>${esc(KEYS[k].n)}</b><span class="sub">例：${esc(KEYS[k].ex)}</span></span></button>`).join('')}</div></div>`;
  return `<div class="phase"><div class="head">${esc(pname(g.senderId))} が今回の鍵を選んでいます…</div><div class="sub">${g.role==='receiver'?'選ばれた鍵はあなたにだけ表示されます':'鍵は4つの候補から選ばれます'}</div></div>`;
 }
 if(ph==='compose'){
  const rv=g.revived.length||g.round>0&&!g.history[g.round].atts.length?`<div class="revived">${IC.ok} ラウンド${g.round+1}開始 — 単語リストを入れ替え${g.revived.length?`／${g.revived.length}文字が復活：<b>${g.revived.map(esc).join(' ')}</b>`:''}</div>`:'';
  if(g.role==='sender')return `<div class="phase">${rv}<div class="head">暗号を作って送信</div><div class="sub">下の${g.alpha?'キーボード':'五十音表'}から文字を選ぼう。使った文字はそのラウンド中は使えない。</div>${composeHtml(g)}</div>`;
  return `<div class="phase">${rv}<div class="head">${esc(pname(g.senderId))} が暗号を作成中…</div><div class="sub">残り ${CS(g).length-g.used.length} 文字</div></div>`;
 }
 if(ph==='answer'){
  const can=g.answerers.includes(me)&&g.myAnswer==null;
  let msg;
  if(can)msg=`<div class="sub">28語から1つ選んで決定</div><button class="primary big" data-act="decide" ${local.sel==null?'disabled':''}>${local.sel==null?'単語を選択':'「'+esc(wordLabel(g,g.wordIds[local.sel]))+'」で決定'}</button>`;
  else if(g.myAnswer!=null)msg=`<div class="sub">回答済み — ほかのプレイヤーを待っています</div>`;
  else if(g.solvedRound.includes(me))msg=`<div class="sub hid">${IC.lock} このラウンドは解読済み。見守ろう</div>`;
  else msg=`<div class="sub">回答を待っています</div>`;
  return `<div class="phase"><div class="head">暗号が届いた</div>${msg}${waitChips()}</div>`;
 }
 if(ph==='reveal'){
  const h=g.history[g.round],a=h.atts[h.atts.length-1];
  let head;
  if(g.revealOk)head=`<div class="head ok">${IC.ok} 受信者が正解！</div><div>${h.target!=null?`伝えた単語は「<b>${esc(wordLabel(g,h.target))}</b>」`:`<span class="sub">${IC.lock} 正解の単語は伏せられています</span>`}</div>`;
  else if(g.lost)head=`<div class="head ng">${IC.ng} 受信者は不正解</div><div>文字を使い切りました。ペアの負け</div>`;
  else head=`<div class="head ng">${IC.ng} 受信者は不正解</div><div class="sub">送信者が暗号を作り直します</div>`;
  return `<div class="phase ${g.revealOk?'okbg':'ngbg'}">${head}${attRows(g,a)}</div>`;
 }
 if(ph==='keyguess'){
  const lostMsg=g.lost?'<div class="sub ng">ペアは文字切れで負け。</div>':'<div class="sub ok">3語すべて伝達成功。</div>';
  if(g.role==='inter'&&g.myKey==null)return `<div class="phase"><div class="head" style="justify-content:space-between"><span>${IC.key} 鍵はどれ？</span>${timerHtml()}</div>${lostMsg}<div class="sub">当てると解読ポイントが2倍</div><div class="keys" style="margin-top:8px">${KEYS.map((k,i)=>`<button class="keyitem ${local.keySel===i?'sel':''}" data-act="keysel" data-i="${i}"><span class="no">${i+1}</span>${ktag(k)}<span>${esc(k.n)}</span></button>`).join('')}</div><button class="primary big" data-act="keydecide" ${local.keySel==null?'disabled':''}>決定</button></div>`;
  return `<div class="phase"><div class="head" style="justify-content:space-between"><span>スパイが鍵を推理中…</span>${timerHtml()}</div>${lostMsg}${g.myKey!=null?`<div class="sub">あなたの回答：${esc(KEYS[g.myKey].n)}</div>`:''}${waitChips()}</div>`;
 }
 if(ph==='result')return resultHtml(g);
 return '';
}
function attRows(g,a){
 const ids=Object.keys(a.res).sort((x,y)=>(y===g.receiverId)-(x===g.receiverId));
 return `<div class="arows">${ids.map(id=>{
  const x=a.res[id],rc=id===g.receiverId;
  let val,st;
  if(x.ans==null){val='<span class="sub">時間切れ</span>';st='s-ng';}
  else if(x.ans===-1){val=`<span class="hid">${IC.lock} 正解（伏せ）</span>`;st='s-hid';}
  else{val=esc(wordLabel(g,x.ans));st=x.ok?'s-ok':'s-ng';}
  return `<div class="arow ${rc?'rc':''} ${st}">${av(id)}<span class="an">${esc(pname(id))}${rc?' <span class="tag t-recv">受信</span>':''}</span><span class="aw">${val}</span><span class="am">${st==='s-ok'||st==='s-hid'?IC.ok:IC.ng}</span></div>`;
 }).join('')}</div>`;
}
function composeHtml(g){
 const n=local.buf.length;
 if(g.alpha)return `<div style="margin-top:8px"><div class="buf alpha">${local.buf.length?local.buf.map(esc).join(''):'<span class="ph">文字を選んでください</span>'}</div>
 ${kanaBoard(g,true)}
 <div class="ctrl ctrl-a"><button data-act="bs" aria-label="1文字消す">${IC.back} 1文字消す</button><button class="primary" data-act="send" ${n?'':'disabled'}>送信</button></div>
 <div class="note">今回 ${n} 文字使用 ／ 残り ${ALPHA.length-g.used.length-n} 文字。ローマ字や英単語で暗号を作ろう。</div></div>`;
 return `<div style="margin-top:8px"><div class="buf">${local.buf.length?local.buf.map(esc).join(''):'<span class="ph">文字を選んでください</span>'}</div>
 ${kanaBoard(g,true)}
 <div class="ctrl"><button data-act="dak">゛゜</button><button data-act="small">小</button><button data-act="bs" aria-label="1文字消す">${IC.back}</button><button class="primary" data-act="send" ${n?'':'disabled'}>送信</button></div>
 <div class="note">今回 ${n} 文字使用 ／ 残り ${KANA.length-g.used.length-n} 文字。濁点・半濁点・小文字は元の文字を消費。長音「ー」も1文字として消費。</div></div>`;
}
function kanaBoard(g,editable){
 const used=new Set(g.used),inBuf=new Set(local.buf.map(c=>baseOf(c,g.alpha)));
 if(g.alpha){
  return `<div class="qwerty">${QWERTY.map((row,ri)=>`<div class="qrow r${ri}">${row.split('').map(k=>{
   const c=['kt','qk'];if(used.has(k))c.push('used');else if(editable&&inBuf.has(k))c.push('inbuf');
   const can=editable&&!used.has(k)&&!inBuf.has(k);
   return `<button class="${c.join(' ')}" ${can?`data-act="tile" data-k="${k}"`:'disabled'}>${k}</button>`;}).join('')}</div>`).join('')}</div>`;
 }
 let h='<div class="kana">';
 for(let d=0;d<5;d++)for(let r=10;r>=0;r--){
  const k=KANA_ROWS[r][d];
  if(!k){h+='<span class="kt empty"></span>';continue;}
  const c=['kt'];if(used.has(k))c.push('used');else if(editable&&inBuf.has(k))c.push('inbuf');
  const can=editable&&!used.has(k)&&!inBuf.has(k);
  h+=`<button class="${c.join(' ')}" ${can?`data-act="tile" data-k="${k}"`:'disabled'}>${k}</button>`;
 }
 return h+'</div>';
}
function wordGrid(g){
 const wrong=new Set(),cur=g.history[g.round];
 if(cur&&cur.target==null)cur.atts.forEach(a=>{for(const id in a.res){const x=a.res[id];if(!x.ok&&x.ans!=null&&x.ans>=0)wrong.add(x.ans);}});
 const can=V.phase==='answer'&&g.answerers.includes(V.me)&&g.myAnswer==null;
 return `<div class="words">${g.words.map((w,i)=>{
  const gi=g.wordIds[i],c=['word'];let badge='';
  if(wrong.has(gi))c.push('wrong');
  if(g.target===gi){c.push('target');badge='<em class="badge tg">お題</em>';}
  if(can&&local.sel===i)c.push('sel');
  if(V.phase==='answer'&&g.myAnswer===gi)c.push('chosen');
  return `<button class="${c.join(' ')}" ${can?`data-act="word" data-i="${i}"`:'disabled'}>${badge}<span class="w">${esc(w.w)}</span>${w.r?`<span class="r">${esc(w.r)}</span>`:''}</button>`;
 }).join('')}</div>`;
}
function historyHtml(g){
 if(!g.history.some(h=>h.atts.length))return '<div class="sub">まだ暗号はありません</div>';
 const out=[];
 g.history.forEach((h,r)=>{
  if(!h.atts.length)return;
  const done=h.done;
  out.unshift(`<div class="lround ${done?'done':''}">
   <div class="lrh"><span class="lrno">R${r+1}</span>${done?(h.target!=null?`<span class="sub">正解</span><b class="lrt">${esc(wordLabel(g,h.target))}</b>`:`<span class="sub">正解</span><b class="lrt hid">${IC.lock} 伏せ</b>`):'<span class="sub">進行中</span>'}<span class="lrc">送信 ${h.atts.length}回</span></div>
   ${h.atts.map((a,i)=>`<div class="latt"><div class="lah"><span class="lno">${i+1}</span><span class="cchip">${esc(a.cipher)}</span><span class="lcnt">${[...a.cipher].length}文字</span></div>${attRows(g,a)}</div>`).join('')}
  </div>`);
 });
 return out.join('');
}
function resultHtml(g){
 const r=g.result,k=KEYS[g.key];
 const rows=g.members.map(id=>{
  let role,detail;
  if(id===g.senderId||id===g.receiverId){role=id===g.senderId?'<span class="tag t-send">送信</span>':'<span class="tag t-recv">受信</span>';detail=g.lost?'伝達失敗':`外した${r.wrong}人 − 当てた${r.right}人`;}
  else{const kg=r.keyGuesses[id],kr=kg===g.key;role='<span class="tag t-inter">スパイ</span>';detail=`解読${g.solved[id]||0}${kr?' ×2':''}<br><span class="sub">鍵:${kg==null?'未回答':esc(KEYS[kg].n)}</span> <span class="${kr?'ok':'ng'}">${kr?IC.ok:IC.ng}</span>`;}
  const tot=(V.players.find(p=>p.id===id)||{}).total;
  return `<tr><td><span style="display:flex;gap:6px;align-items:flex-start">${av(id,'md')}<span>${esc(pname(id))}<br>${role}</span></span></td><td>${detail}</td><td class="num">${r.scores[id]>0?'+':''}${r.scores[id]}</td><td class="num">${tot==null?'-':tot}</td></tr>`;
 }).join('');
 return `<div class="phase ${g.lost?'ngbg':'okbg'}"><div class="sub center" style="letter-spacing:.2em">SET ${V.match.cur} / ${V.match.sets}</div><div class="bigres">${g.lost?'ペアの負け':'3語の伝達成功'}</div>
 <div class="keybox" style="margin-top:10px">${IC.key}<div><div class="sub">鍵の正体</div>${ktag(k)} <b>${esc(k.n)}</b> <span class="sub">例：${esc(k.ex)}</span></div></div>
 <div class="sub" style="margin-top:8px">伝える単語：${r.targets.map((t,i)=>`R${i+1}「${esc(wordLabel(g,t))}」`).join(' ')}</div>
 <table style="margin-top:8px"><tr><th>プレイヤー</th><th>内訳</th><th style="text-align:right">今セット</th><th style="text-align:right">累計</th></tr>${rows}</table>
 </div>${(()=>{const M=V.match,last=M.cur>=M.sets;
  if(last)return V.host?`<button class="primary big" data-act="final">最終結果へ</button><div class="note center">まもなく自動で最終結果に移ります</div>`:'<div class="note center">まもなく最終結果に移ります</div>';
  return `${V.host?`<button class="primary big" data-act="start">次のセットへ（${M.cur+1}/${M.sets}）</button>`:'<div class="note center">ホストが次のセットを開始するのを待っています</div>'}`;})()}`;
}
function finalHtml(){
 const M=V.match,ps=V.players.slice().sort((a,b)=>b.total-a.total);
 let rank=0,prev=null;
 const rk=ps.map((p,i)=>{if(p.total!==prev){rank=i+1;prev=p.total;}return {p,rank};});
 const top=rk.filter(x=>x.rank===1);
 const head=`<div class="final-hero"><div class="cls">MISSION COMPLETE · ${M.sets} SETS</div><div class="final-title">最終結果</div>
  <div class="podium">${top.map(x=>`<div class="pod1">${av(x.p.id,'xl')}<b>${esc(x.p.name)}</b><span class="pts">${x.p.total}</span></div>`).join('')}</div>
  <div class="sub">${top.length>1?'同点優勝':'優勝'}</div></div>`;
 const list=`<div class="card"><h3>順位</h3><div class="plist">${rk.map(({p,rank})=>`<div class="pl rk${rank}"><span class="rkn">${rank}</span>${av(p.id,'md')}<span class="nm">${esc(p.name)}${p.id===V.me?' <span class="sub">(あなた)</span>':''}</span><span class="pts">${p.total}</span></div>`).join('')}</div></div>`;
 const sets=`<div class="card"><h3>セットごとの得点</h3><div class="tblwrap"><table class="settbl"><tr><th>プレイヤー</th>${M.hist.map(h=>`<th>S${h.set}</th>`).join('')}<th>計</th></tr>${rk.map(({p})=>`<tr><td><span class="who">${av(p.id)}${esc(p.name)}</span></td>${M.hist.map(h=>{const v=h.scores[p.id];const role=p.id===h.s?'t-send':p.id===h.r?'t-recv':'';return `<td class="num ${role}">${v==null?'-':v}</td>`;}).join('')}<td class="num">${p.total}</td></tr>`).join('')}</table></div><div class="note"><span class="t-send">青</span>＝送信者、<span class="t-recv">紫</span>＝受信者だったセット</div></div>`;
 return topBar()+head+list+sets+(V.host?`<button class="primary big" data-act="start">もう一度（全${M.sets}セット）</button><button class="big" data-act="lobby">待機室に戻る</button><div class="foot"><button class="ghost" data-act="stats">戦績を見る</button></div>`:'<div class="note center" style="margin-top:14px">ホストの操作を待っています</div><div class="foot"><button class="ghost" data-act="stats">戦績を見る</button></div>');
}
function gameHtml(){
 const g=V.g,ph=V.phase;
 let h=topBar(`<span class="sub">${g.alpha?'ABC・':''}S${V.match.cur}/${V.match.sets}・R${Math.min(g.round+1,3)}/3</span>`);
 h+=stickyHtml(g);
 h+=roleCard(g);
 h+=phaseHtml(g);
 h+=`<div class="card"><h3>単語リスト</h3>${wordGrid(g)}</div>`;
 if(!(ph==='compose'&&g.role==='sender'))h+=`<div class="card"><h3><span>使える文字</span><span>残り ${CS(g).length-g.used.length}/${CS(g).length}</span></h3>${kanaBoard(g,false)}</div>`;
 h+=`<div class="card"><h3>暗号の履歴</h3>${historyHtml(g)}</div>`;
 h+=`<div class="card"><h3><span>プレイヤー</span><span>累計</span></h3>${playerList()}</div>`;
 if(V.host&&ph!=='result')h+=`<div class="foot"><button class="ghost small" data-act="abort">このゲームを中断して待機室へ</button></div>`;
 return h;
}
function modalHtml(){
 if(local.modal==='rules')return `<div class="modal" data-act="close"><div class="sheet rules" data-stop="1"><h3>ルール <button class="ghost small" data-act="close">閉じる</button></h3>
 <p class="lead">送信者は<b>鍵</b>を使った暗号で、<b>受信者だけ</b>にお題の単語を伝える。<br>スパイは暗号を盗み見て、単語と鍵を見破れ。</p>
 <div class="rsec"><div class="rh">役割</div><ul>
  <li><span class="tag t-send">送信者</span> 鍵を選び、暗号を作る</li>
  <li><span class="tag t-recv">受信者</span> 鍵を知っている。暗号から単語を当てる</li>
  <li><span class="tag t-inter">スパイ</span> 鍵を知らない。単語と鍵を推理する</li></ul></div>
 <div class="rsec"><div class="rh">1セットの流れ（3ラウンド）</div><ol>
  <li>送信者が4つの候補から<b>鍵</b>を1つ選ぶ（鍵は受信者にだけ見える）</li>
  <li>送信者が、28語のリストからお題の単語を<b>ひらがなの暗号</b>で送る</li>
  <li>送信者以外が60秒以内に単語を選び、一斉に答え合わせ</li>
  <li>受信者が外したら暗号を作り直す。当たれば次のラウンドへ</li>
  <li>3ラウンド後、スパイが鍵を推理する</li></ol></div>
 <div class="rsec"><div class="rh">暗号の文字</div><ul>
  <li>使えるのは五十音(47文字)。長音「ー」も含む。<b>一度使った文字は使えなくなる</b>（同じ暗号内の重複も不可）</li>
  <li>濁点・小文字は元の文字を使う。長音「ー」も1文字として使う</li>
  <li>ラウンドが進むと、使った文字の半分が復活し、単語リストも入れ替わる</li>
  <li>文字を使い切ったらペアの負け</li>
  <li><b>アルファベット版</b>（ルーム設定で選択）：アルファベット(26文字)をQWERTY配列のキーボードで使う。ローマ字や英単語で暗号を作る。お題・鍵は同じ</li></ul></div>
 <div class="rsec"><div class="rh">得点</div><ul>
  <li><b>スパイ</b>：当てた単語の数。鍵も当てれば<b>2倍</b></li>
  <li><b>送信者・受信者</b>：鍵を外したスパイの数 − 当てた数（負けたら0点）</li>
  <li>スパイが当てた答えは、どの設定でも本人以外には伏せられる</li>
  <li>ルーム設定「正解を伏せる」がオンなら、受信者が当てた単語もスパイには伏せられる（当てたスパイには見える）。全部わかるのはセット終了時</li></ul></div>
 <div class="rsec"><div class="rh">勝敗</div><p class="sub" style="margin:0">セット数はホストが決める。セットごとにペアはランダムで交代し、全セットの合計得点で順位を競う。</p></div>
 </div></div>`;
 if(local.modal==='stats')return statsHtml();
 if(local.modal==='avatar'&&V){
  const mine=(V.players.find(p=>p.id===V.me)||{}).a;
  return `<div class="modal" data-act="close"><div class="sheet" data-stop="1"><h3>アイコンを選ぶ <button class="ghost small" data-act="close">閉じる</button></h3><div class="note" style="margin:0 0 6px">ほかのプレイヤーが使っているアイコンは選べません</div><div class="avgrid">${ANIMALS.map((an,i)=>{
   const owner=V.players.find(p=>p.a===i&&p.id!==V.me);
   return `<button class="avopt ${mine===i?'cur':''}" data-act="avset" data-a="${i}" ${owner?'disabled':''}><span class="av">${animalSvg(i)}</span>${esc(an.n)}${owner?`<span class="who2">${esc(owner.name)}</span>`:''}</button>`;}).join('')}</div></div></div>`;
 }
 if(local.modal==='keys')return `<div class="modal" data-act="close"><div class="sheet" data-stop="1"><h3>鍵リスト（20種） <button class="ghost small" data-act="close">閉じる</button></h3><div class="note" style="margin:0 0 8px">${ktag(KEYS[0])} 単語の<b>読み（ひらがな）</b>を使う鍵。カタカナ語もひらがなで考える。<br>${ktag(KEYS[10])} 単語から<b>連想</b>する鍵。<br>どの鍵も、送信者が条件に合う言葉を自由に選べる。</div><div class="keys">${KEYS.map((k,i)=>`<div class="keyitem" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="no">${i+1}</span>${ktag(k)}<span>${esc(k.n)}</span><span class="ex">${esc(k.ex)}</span></div>`).join('')}</div></div></div>`;
 return '';
}
function tickTimer(){
 const el=document.getElementById('timer');if(!el||localDeadline==null)return;
 const ms=Math.max(0,localDeadline-performance.now()),s=Math.ceil(ms/1000);
 el.textContent=s;
 const hurry=s<=10;
 const box=document.getElementById('timerBox');if(box)box.classList.toggle('hurry',hurry);
 const st=document.getElementById('sticky');if(st)st.classList.toggle('hurry',hurry);
 const bar=document.getElementById('timerBar');if(bar)bar.style.width=(ms/localTotal*100).toFixed(1)+'%';
 if(s<=5&&s>0&&s!==lastTick){lastTick=s;SE.tick();}
}
setInterval(tickTimer,200);

/* ===== 入力 ===== */
$app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el)return;
 if(el.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
 ac();
 const A=el.dataset.act;
 if(A==='create'||A==='join'){
  const name=document.getElementById('nm').value.trim().slice(0,10);
  const code=document.getElementById('rc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!name){lmsg('名前を入力してください');return;}
  try{localStorage.setItem('angoName',name);}catch(err){}
  if(code==='TEST'){startTest(name);return;}
  try{localStorage.removeItem('angoHost');localStorage.removeItem('angoJoin');}catch(err){}
  if(A==='create')hostRoom(name,code||randCode());
  else{if(!code){lmsg('ルームコードを入力してください');return;}joinRoom(name,code);}
  return;
 }
 if(A==='resumehost'){const sv=savedSess().host;if(sv)hostRoom('',sv.code,sv);return;}
 if(A==='resumejoin'){const sv=savedSess().join;if(sv)joinRoom(sv.name,sv.code);return;}
 if(A==='forget'){try{localStorage.removeItem('angoHost');localStorage.removeItem('angoJoin');}catch(err){}renderLobby();return;}
 if(A==='rules'||A==='keys'||A==='stats'){local.modal=A;render();return;}
 if(A==='statreset'){if(confirm('戦績をすべてリセットしますか？')){try{localStorage.removeItem('angoStats');}catch(err){}render();}return;}
 if(A==='close'){local.modal=null;render();return;}
 if(!V)return;
 const g=V.g;
 switch(A){
 case 'start':act({t:'start'});break;
 case 'sets':act({t:'sets',n:+el.dataset.n});break;
 case 'hide':act({t:'hide',on:el.checked});break;
 case 'alpha':act({t:'alpha',on:el.dataset.on==='1'});break;
 case 'final':act({t:'final'});break;
 case 'lobby':act({t:'lobby'});break;
 case 'addbot':act({t:'addbot'});break;
 case 'rmbot':act({t:'rmbot',id:el.dataset.id});break;
 case 'avmodal':local.modal='avatar';render();break;
 case 'avset':act({t:'avatar',a:+el.dataset.a});local.modal=null;render();break;
 case 'pick':act({t:'pick',role:el.dataset.role,id:el.dataset.id||null});break;
 case 'abort':if(confirm('このゲームを中断しますか？（得点は加算されません）'))act({t:'abort'});break;
 case 'tile':SE.tap();if(local.buf.length<20)local.buf.push(el.dataset.k);render();break;
 case 'dak':if(local.buf.length){const i=local.buf.length-1;local.buf[i]=cycleDak(local.buf[i]);SE.tap();render();}break;
 case 'small':if(local.buf.length){const i=local.buf.length-1;local.buf[i]=toggleSmall(local.buf[i]);SE.tap();render();}break;
 case 'bar':if(local.buf.length&&local.buf.length<20){local.buf.push('ー');SE.tap();render();}break;
 case 'bs':local.buf.pop();render();break;
 case 'send':if(local.buf.length)act({t:'cipher',text:local.buf.join('')});break;
 case 'word':local.sel=+el.dataset.i;SE.tap();render();break;
 case 'decide':if(local.sel!=null)act({t:'answer',i:local.sel});break;
 case 'keysel':local.keySel=+el.dataset.i;SE.tap();render();break;
 case 'kpick':act({t:'keypick',k:+el.dataset.k});break;
 case 'keydecide':if(local.keySel!=null)act({t:'keyguess',i:local.keySel});break;
 }
});
renderLobby();
</script>
</body>
</html>
