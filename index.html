<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ANGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#12151c;--panel:#1c212c;--panel2:#252b38;--line:#333b4c;--text:#eef1f6;--sub:#9aa4b5;--key:#f2b134;--ok:#37c9a6;--ng:#ff6b6b;--send:#6aa8ff;--recv:#c58bff;--paper:#f3ead6;--ink:#2a2418}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;cursor:pointer}
button:disabled{cursor:default}
.primary{background:var(--key);color:#1a1404;border-color:transparent;font-weight:700}
.primary:disabled{opacity:.35}
.big{width:100%;padding:13px;font-size:16px;margin-top:10px}
.ghost{background:transparent}
.small{font-size:12px;padding:5px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--sub);font-size:12.5px}
.center{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:900;font-size:18px;letter-spacing:.06em}
.logo small{font-size:11px;color:var(--sub);font-weight:500}
.hero{text-align:center;padding:40px 0 16px}
.hero .logo{font-size:44px;letter-spacing:.18em}
.code{font-size:40px;font-weight:900;letter-spacing:.2em;color:var(--key)}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-top:4px}
label{display:block;margin-top:12px;font-size:13px;color:var(--sub)}
.err{color:var(--ng);font-size:13px;margin-top:10px;text-align:center;min-height:1.5em}
.note{color:var(--sub);font-size:12px;margin-top:8px}
.ic{width:1em;height:1em;vertical-align:-.15em;flex:none}
.timer{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--panel2);padding:3px 10px;border-radius:99px}
.timer.hurry{color:var(--ng)}
.tag{font-size:11px;padding:0 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-send{color:var(--send)}.t-recv{color:var(--recv)}.t-inter{color:var(--sub)}
.pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.role{font-size:17px;font-weight:900}
.keybox{display:flex;align-items:center;gap:8px;background:rgba(242,177,52,.1);border:1px solid rgba(242,177,52,.4);border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--key)}
.keybox b{font-size:16px}
.keybox .sub{color:#c9a45a}
.tgbox{display:flex;align-items:center;gap:8px;background:rgba(106,168,255,.1);border:1px solid rgba(106,168,255,.4);border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--send)}
.tgbox b{font-size:18px}
.phase{border-radius:14px;padding:12px 14px;margin-top:12px;background:var(--panel2);border:1px solid var(--line)}
.phase.okbg{border-color:var(--ok);background:rgba(55,201,166,.1)}
.phase.ngbg{border-color:var(--ng);background:rgba(255,107,107,.08)}
.phase .head{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.cipher{font-size:30px;font-weight:900;letter-spacing:.18em;text-align:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 10px;margin:8px 0;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.chip.done{border-color:var(--ok);color:var(--ok)}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.word{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;padding:8px 2px 5px;min-width:0;background:var(--panel2);border-radius:10px}
.word:disabled{color:var(--text)}
.word .w{font-weight:700;font-size:12.5px;line-height:1.2;text-align:center;word-break:break-all}
.word .r{font-size:8.5px;word-break:break-all;text-align:center;color:var(--sub);line-height:1.2;margin-top:1px}
.word.sel{border-color:var(--key);background:rgba(242,177,52,.2)}
.word.chosen{border-color:var(--ok);background:rgba(55,201,166,.16)}
.word.past{opacity:.4}
.word.wrong .w{text-decoration:line-through;text-decoration-color:var(--ng);opacity:.55}
.word.target{box-shadow:0 0 0 2px var(--send) inset;border-color:var(--send)}
.badge{position:absolute;top:1px;right:5px;font-style:normal;font-size:9px;color:var(--sub);font-weight:700}
.badge.tg{color:var(--send)}
.kana{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.kt{aspect-ratio:1;padding:0;border-radius:6px;background:var(--paper);color:var(--ink);border:none;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;min-width:0}
.kt.empty{background:transparent}
.kt.used{background:#262c38;color:#4a5365;text-decoration:line-through}
.kt.inbuf{background:var(--key);color:#1a1404}
.buf{min-height:54px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:8px;font-size:28px;font-weight:900;letter-spacing:.14em;margin-bottom:8px}
.ph{font-size:14px;color:#9a8f78;letter-spacing:0;font-weight:500}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.7fr;gap:6px;margin-top:8px}
.ctrl button{padding:9px 0;font-weight:700}
.hround{border-top:1px dashed var(--line);padding:8px 0 4px}
.hround:first-of-type{border-top:none;padding-top:0}
.hhead{font-weight:700;font-size:13px}
.hatt{margin-top:6px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cchip{display:inline-block;background:var(--paper);color:var(--ink);font-weight:900;border-radius:6px;padding:0 8px;letter-spacing:.1em;font-size:14px}
.ok{color:var(--ok)}.ng{color:var(--ng)}.hid{color:var(--key)}
.plist{display:flex;flex-direction:column;gap:7px}
.pl{display:flex;align-items:center;gap:8px;font-size:14px}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.45}
.pts{font-weight:900;font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.sheet ul{padding-left:1.2em;margin:6px 0}
.sheet li{margin:5px 0;font-size:14px}
.keys{display:flex;flex-direction:column;gap:6px}
.keyitem{text-align:left;display:flex;gap:8px;align-items:baseline;width:100%}
.keyitem .no{color:var(--sub);font-size:11px;min-width:1.6em}
.keyitem .ex{color:var(--sub);font-size:11.5px;margin-left:auto;white-space:nowrap}
.keyitem.sel{border-color:var(--key);background:rgba(242,177,52,.18)}
.keyitem.ans{border-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ng);color:#fff;padding:8px 14px;border-radius:10px;z-index:20;font-size:13px;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 3px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:11.5px}
td.num{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.bigres{font-size:22px;font-weight:900;text-align:center}
.foot{margin-top:18px;text-align:center}
.ktag{font-size:10px;font-weight:700;padding:0 6px;border-radius:5px;flex:none;align-self:center;white-space:nowrap}
.kt-m{background:rgba(106,168,255,.18);color:var(--send)}
.kt-i{background:rgba(55,201,166,.18);color:var(--ok)}
.sticky{position:sticky;top:0;z-index:6;margin:10px -16px 0;padding:8px 16px 10px;background:rgba(18,21,28,.97);border-bottom:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.sk-row{display:flex;align-items:center;gap:12px}
.sk-ci{flex:1;min-width:0}
.sk-lb{font-size:11px;color:var(--sub);margin-bottom:2px}
.sk-cipher{font-size:30px;font-weight:900;letter-spacing:.16em;background:var(--paper);color:var(--ink);border-radius:10px;padding:4px 10px;text-align:center;word-break:break-all;line-height:1.3}
.sk-kg{font-size:20px;font-weight:900;color:var(--key)}
.sk-time{width:78px;height:78px;border-radius:50%;border:5px solid var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1;background:var(--panel)}
.sk-time span{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.sk-time small{font-size:10px;color:var(--sub);margin-top:2px}
.sk-time.hurry{border-color:var(--ng);color:var(--ng);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sk-bar{height:7px;background:var(--panel2);border-radius:99px;margin-top:8px;overflow:hidden}
.sk-bar i{display:block;height:100%;width:100%;background:var(--key);transition:width .2s linear}
.sticky.hurry .sk-bar i{background:var(--ng)}
.sk-res{display:flex;flex-direction:column;align-items:center;font-size:30px;flex:none;width:78px}
.sk-res small{font-size:11px;font-weight:700}
.pkrow{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:14px}
.pkrow>.tag{margin-top:6px}
.pkchips{display:flex;flex-wrap:wrap;gap:5px}
.pk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 10px 4px 5px;border-radius:99px}
.pk:first-child{padding-left:10px}
.pk.on{border-color:var(--key);background:rgba(242,177,52,.2);color:var(--key)}
.pk:disabled{opacity:.3}
.av{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#2e3546;flex:none;overflow:hidden}
.av.md{width:30px;height:30px}.av.lg{width:44px;height:44px}
.avs{width:100%;height:100%;display:block}
.who{display:inline-flex;align-items:center;gap:4px}
.lround{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;background:var(--panel2)}
.lround:first-child{margin-top:0}
.lround.done{opacity:.85}
.lrh{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lrno{font-weight:900;font-size:12px;background:var(--key);color:#1a1404;border-radius:6px;padding:0 7px}
.lrt{font-size:15px}
.lrc{margin-left:auto;font-size:11.5px;color:var(--sub)}
.latt{padding:8px 0 4px;border-bottom:1px dashed var(--line)}
.latt:last-child{border-bottom:none}
.lah{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.lno{width:18px;height:18px;border-radius:50%;border:1px solid var(--sub);color:var(--sub);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lcnt{font-size:11px;color:var(--sub)}
.arows{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.arow{display:grid;grid-template-columns:22px 1fr auto 16px;align-items:center;gap:6px;font-size:13px;padding:3px 6px;border-radius:8px;background:rgba(255,255,255,.03)}
.arow.rc{background:rgba(197,139,255,.1);box-shadow:inset 3px 0 0 var(--recv)}
.arow .an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .aw{font-weight:700}
.arow.s-ng .aw{color:var(--sub)}
.arow.s-ok .aw,.arow.s-ok .am{color:var(--ok)}
.arow.s-ng .am{color:var(--ng)}
.arow.s-hid .am{color:var(--key)}
.lround .cchip{font-size:16px;padding:1px 10px}
.revived{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ok);font-size:13px;background:rgba(55,201,166,.1);border:1px solid rgba(55,201,166,.4);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.revived b{letter-spacing:.12em}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===== データ ===== */
const KANA_ROWS=[['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],['わ','','','','を'],['ん','','','','']];
const KANA=KANA_ROWS.flat().filter(Boolean);
const DAK={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
const HAN={は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'};
const SMALL={あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ',つ:'っ',や:'ゃ',ゆ:'ゅ',よ:'ょ',わ:'ゎ'};
const NORM={};for(const m of [DAK,HAN,SMALL])for(const k in m)NORM[m[k]]=k;
const norm=c=>NORM[c]||c;
function cycleDak(c){const b=norm(c);const o=[b,DAK[b],HAN[b]].filter(Boolean);if(o.length<2)return c;return o[(o.indexOf(c)+1)%o.length];}
function toggleSmall(c){const b=norm(c);if(!SMALL[b])return c;return c===SMALL[b]?b:SMALL[b];}

const KEYS=[
 {t:'文字',n:'頭文字が同じ言葉',ex:'りんご → りす'},
 {t:'文字',n:'頭文字も文字数も同じ言葉',ex:'ねこ → ねぎ'},
 {t:'文字',n:'2文字目が同じ言葉',ex:'りんご → まんが'},
 {t:'文字',n:'最後の文字が同じ言葉',ex:'りんご → いちご'},
 {t:'文字',n:'しりとりで次に来る言葉',ex:'りんご → ごりら'},
 {t:'文字',n:'しりとりで前に来る言葉',ex:'りんご → こおり'},
 {t:'文字',n:'頭文字と同じ行で始まる言葉',ex:'りんご → らっぱ'},
 {t:'文字',n:'読みの文字を2つ以上使った言葉',ex:'とけい → けいと'},
 {t:'文字',n:'1文字だけ変えた言葉',ex:'いぬ → いす'},
 {t:'文字',n:'その言葉を含む言葉',ex:'りんご → りんごあめ'},
 {t:'意味',n:'仲間の名前（分類）',ex:'りんご → くだもの'},
 {t:'意味',n:'似ている別のもの',ex:'りんご → なし'},
 {t:'意味',n:'セットで出てくるもの',ex:'ごはん → はし'},
 {t:'意味',n:'ある・いる場所',ex:'ペンギン → なんきょく'},
 {t:'意味',n:'する・される動き',ex:'本 → よむ'},
 {t:'意味',n:'見た目や性質の特徴',ex:'バナナ → ほそながい'},
 {t:'意味',n:'同じ色のもの',ex:'バナナ → れもん'},
 {t:'意味',n:'役目・できること',ex:'傘 → ぬれない'},
 {t:'意味',n:'その場で言いそうな一言',ex:'誕生日 → おめでとう'},
 {t:'意味',n:'感じる気持ち',ex:'おばけ → こわい'}
];
const ktag=k=>`<span class="ktag ${k.t==='文字'?'kt-m':'kt-i'}">${k.t}</span>`;

/* ===== サングラス動物アイコン（16種） ===== */
const GL='<g><path d="M9.5 27.5l5 1.2M54.5 27.5l-5 1.2" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/><rect x="14" y="24.5" width="15.5" height="10.5" rx="4.5" fill="#141414"/><rect x="34.5" y="24.5" width="15.5" height="10.5" rx="4.5" fill="#141414"/><path d="M29.5 28.5q2.5-2 5 0" stroke="#141414" stroke-width="2.2" fill="none"/><path d="M17 27.6h5M37.5 27.6h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></g>';
const MO='<path d="M28 45.5q4 3.5 8 0" stroke="#2a1d14" stroke-width="2" fill="none" stroke-linecap="round"/>';
const HD=c=>`<circle cx="32" cy="35" r="20" fill="${c}"/>`;
const SHEEP=[[14,24],[21,14],[32,10],[43,14],[50,24],[54,36],[48,48],[32,54],[16,48],[10,36]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#f3efe6"/>`).join('');
const ANIMALS=[
 {n:'ネコ',s:`<path d="M13 27L16 6l13 11z" fill="#f2a65a"/><path d="M51 27L48 6 35 17z" fill="#f2a65a"/><path d="M17 20l1.2-8 6 5z" fill="#f7c9a0"/><path d="M47 20l-1.2-8-6 5z" fill="#f7c9a0"/>${HD('#f2a65a')}<path d="M29.5 40h5l-2.5 3z" fill="#e0607e"/><path d="M11 40l9 1.2M11 44.5l9-1M53 40l-9 1.2M53 44.5l-9-1" stroke="#7a4a22" stroke-width="1.2"/>${MO}`},
 {n:'イヌ',s:`${HD('#c98b4f')}<ellipse cx="13" cy="33" rx="6.5" ry="13" fill="#8a5a2e"/><ellipse cx="51" cy="33" rx="6.5" ry="13" fill="#8a5a2e"/><ellipse cx="32" cy="44" rx="10" ry="7.5" fill="#f1d6b0"/><ellipse cx="32" cy="40.5" rx="3.6" ry="2.6" fill="#2a1d14"/>${MO}`},
 {n:'ウサギ',s:`<ellipse cx="24" cy="12" rx="5.5" ry="13" fill="#f4f1ec"/><ellipse cx="40" cy="12" rx="5.5" ry="13" fill="#f4f1ec"/><ellipse cx="24" cy="12" rx="2.5" ry="9" fill="#f5b8c8"/><ellipse cx="40" cy="12" rx="2.5" ry="9" fill="#f5b8c8"/>${HD('#f4f1ec')}<circle cx="32" cy="41" r="2.2" fill="#e0607e"/><circle cx="20" cy="42" r="3.5" fill="#f5b8c8" opacity=".7"/><circle cx="44" cy="42" r="3.5" fill="#f5b8c8" opacity=".7"/>${MO}`},
 {n:'クマ',s:`<circle cx="16" cy="18" r="7.5" fill="#8b5a3c"/><circle cx="48" cy="18" r="7.5" fill="#8b5a3c"/><circle cx="16" cy="18" r="4" fill="#c58b65"/><circle cx="48" cy="18" r="4" fill="#c58b65"/>${HD('#8b5a3c')}<ellipse cx="32" cy="43.5" rx="9.5" ry="7.5" fill="#d9b08c"/><ellipse cx="32" cy="40" rx="3.6" ry="2.6" fill="#2a1d14"/>${MO}`},
 {n:'パンダ',s:`<circle cx="16" cy="18" r="7.5" fill="#222"/><circle cx="48" cy="18" r="7.5" fill="#222"/>${HD('#f7f7f5')}<ellipse cx="32" cy="40.5" rx="3.6" ry="2.6" fill="#222"/>${MO}`},

/* ===== ホスト処理 ===== */
function newHost(){return {phase:'wait',players:[],game:null,gameNo:0,pick:{s:null,r:null}};}
function addPlayer(id,name,bot){
 const taken=H.players.map(p=>p.a);
 const a=shuffle([...ANIMALS.keys()].filter(i=>!taken.includes(i)))[0];
 H.players.push({id,name:bot?ANIMALS[a].n+'(bot)':name,bot,a,online:true,total:0,sent:0});
}
function pickWords(g){
 const av=shuffle([...WORDS.keys()].filter(i=>!g.seen.includes(i)));
 g.words=av.slice(0,WN);g.seen.push(...g.words);
 g.target=g.words[rint(WN)];g.targets.push(g.target);
}
function pById(id){return H.players.find(p=>p.id===id);}
function isOn(id){const p=pById(id);return !!(p&&p.online);}
function interceptors(g){return g.members.filter(id=>id!==g.senderId&&id!==g.receiverId);}
function answerers(g){return [g.receiverId,...interceptors(g).filter(id=>!g.solvedRound.includes(id))];}
function pending(list,done){return list.filter(id=>!(id in done)&&isOn(id));}
function setT(ms,fn){clearT();hostTimer=setTimeout(fn,ms);}
function clearT(){if(hostTimer){clearTimeout(hostTimer);hostTimer=null;}}

function startGame(){
 const ps=H.players.filter(p=>p.online);
 if(ps.length<3){sendErr(myId,'3人以上必要です');return;}
 let sender=H.pick.s?ps.find(p=>p.id===H.pick.s):null;
 let receiver=H.pick.r?ps.find(p=>p.id===H.pick.r):null;
 if(sender&&sender===receiver)receiver=null;
 if(!sender){const pool=ps.filter(p=>p!==receiver);const min=Math.min(...pool.map(p=>p.sent));sender=shuffle(pool.filter(p=>p.sent===min))[0];}
 if(!receiver)receiver=shuffle(ps.filter(p=>p!==sender))[0];
 H.pick={s:null,r:null};
 sender.sent++;
 H.gameNo++;
 H.game={senderId:sender.id,receiverId:receiver.id,members:shuffle(ps.map(p=>p.id)),key:rint(KEYS.length),
  seen:[],words:[],target:-1,targets:[],
  round:0,used:[],rounds:[[]],solved:{},solvedRound:[],answers:{},curCipher:'',deadline:0,keyGuesses:{},revealOk:false,lost:false,result:null,revived:[]};
 pickWords(H.game);
 H.phase='compose';
 broadcast();
}
function checkCipher(text,used){
 const seen=[];
 for(const c of [...text]){
  if(c==='ー')continue;
  const b=norm(c);
  if(!KANA.includes(b))return {err:'ひらがな以外は使えません'};
  if(used.includes(b))return {err:'「'+b+'」は使用済みです'};
  if(seen.includes(b))return {err:'「'+b+'」が重複しています'};
  seen.push(b);
 }
 if(!seen.length)return {err:'1文字以上必要です'};
 return {bases:seen};
}
function handleAction(pid,a){
 const g=H.game;
 switch(a.t){
 case 'start':if(pid===myId&&(H.phase==='wait'||H.phase==='result'))startGame();break;
 case 'pick':{
  if(pid!==myId||!(H.phase==='wait'||H.phase==='result'))return;
  const role=a.role==='r'?'r':'s',other=role==='s'?'r':'s',id=a.id||null;
  if(id&&!pById(id))return;
  H.pick[role]=id;if(id&&H.pick[other]===id)H.pick[other]=null;
  broadcast();break;}
 case 'abort':if(pid===myId&&g){clearT();H.game=null;H.phase='wait';broadcast();}break;
 case 'cipher':{
  if(!g||H.phase!=='compose'||pid!==g.senderId)return;
  const text=String(a.text||'').slice(0,20);
  const r=checkCipher(text,g.used);
  if(r.err){sendErr(pid,r.err);return;}
  g.used.push(...r.bases);g.curCipher=text;g.answers={};
  H.phase='answer';g.deadline=Date.now()+ANSWER_MS;setT(ANSWER_MS,endAnswer);
  broadcast();break;}
 case 'answer':{
  if(!g||H.phase!=='answer')return;
  if(!answerers(g).includes(pid)||pid in g.answers)return;
  const i=a.i|0;if(i<0||i>=WN)return;
  g.answers[pid]=g.words[i];
  if(!pending(answerers(g),g.answers).length)endAnswer();else broadcast();
  break;}
 case 'keyguess':{
  if(!g||H.phase!=='keyguess')return;
  if(!interceptors(g).includes(pid)||pid in g.keyGuesses)return;
  const i=a.i|0;if(i<0||i>=KEYS.length)return;
  g.keyGuesses[pid]=i;
  if(!pending(interceptors(g),g.keyGuesses).length)finishGame();else broadcast();
  break;}
 }
}
function endAnswer(){
 const g=H.game;if(!g||H.phase!=='answer')return;clearT();
 const t=g.target,res={};
 for(const id of answerers(g)){
  const a=(id in g.answers)?g.answers[id]:null,ok=a===t;
  res[id]={ans:a,ok};
  if(ok&&id!==g.receiverId){g.solvedRound.push(id);g.solved[id]=(g.solved[id]||0)+1;}
 }
 g.rounds[g.round].push({cipher:g.curCipher,res});
 g.revealOk=res[g.receiverId].ok;
 if(!g.revealOk&&g.used.length>=KANA.length)g.lost=true;
 H.phase='reveal';broadcast();
 setT(g.revealOk?5500:4200,afterReveal);
}
function afterReveal(){
 const g=H.game;if(!g||H.phase!=='reveal')return;
 if(g.lost){toKey();return;}
 if(g.revealOk){g.round++;g.solvedRound=[];if(g.round>=3){toKey();return;}
  const back=shuffle(g.used.slice()).slice(0,Math.floor(g.used.length/2));
  g.used=g.used.filter(c=>!back.includes(c));g.revived=back;pickWords(g);g.rounds.push([]);}
 g.revealOk=false;H.phase='compose';broadcast();
}
function toKey(){const g=H.game;g.keyGuesses={};H.phase='keyguess';g.deadline=Date.now()+KEY_MS;setT(KEY_MS,finishGame);broadcast();}
function finishGame(){
 const g=H.game;if(!g||H.phase!=='keyguess')return;clearT();
 const inter=interceptors(g);
 const right=inter.filter(id=>g.keyGuesses[id]===g.key).length,wrong=inter.length-right;
 const pairPts=g.lost?0:wrong-right,scores={};
 scores[g.senderId]=pairPts;scores[g.receiverId]=pairPts;
 for(const id of inter)scores[id]=(g.solved[id]||0)*(g.keyGuesses[id]===g.key?2:1);
 for(const id in scores){const p=pById(id);if(p)p.total+=scores[id];}
 g.result={scores,right,wrong,pairPts};
 H.phase='result';broadcast();
}
function viewFor(pid){
 const v={phase:H.phase,me:pid,host:pid===myId,gameNo:H.gameNo,test:testMode,code:roomCode,pick:Object.assign({},H.pick),
  players:H.players.map(p=>({id:p.id,name:p.name,a:p.a,total:p.total,online:p.online,bot:p.bot}))};
 const g=H.game;if(!g)return v;
 const role=pid===g.senderId?'sender':pid===g.receiverId?'receiver':g.members.includes(pid)?'inter':'spec';
 const fin=H.phase==='result',pair=role==='sender'||role==='receiver',live=H.phase==='answer'||H.phase==='keyguess';
 v.g={role,senderId:g.senderId,receiverId:g.receiverId,members:g.members,
  key:(pair||fin)?g.key:null,
  words:g.words.map(i=>WORDS[i]),wordIds:g.words.slice(),
  round:g.round,used:g.used.slice(),
  target:(role==='sender'&&['compose','answer','reveal'].includes(H.phase))?g.target:null,
  history:g.rounds.map((atts,r)=>({
   target:(r<g.round||fin||(r===g.round&&H.phase==='reveal'&&g.revealOk))?g.targets[r]:null,
   atts:atts.map(a=>{const res={};for(const id in a.res){const x=a.res[id];res[id]={ok:x.ok,ans:(x.ok&&id!==g.receiverId&&id!==pid&&!fin)?-1:x.ans};}return {cipher:a.cipher,res};})
  })),
  cipher:H.phase==='answer'?g.curCipher:null,
  answerers:H.phase==='answer'?answerers(g):H.phase==='keyguess'?interceptors(g):[],
  answered:H.phase==='answer'?Object.keys(g.answers):H.phase==='keyguess'?Object.keys(g.keyGuesses):[],
  myAnswer:(H.phase==='answer'&&pid in g.answers)?g.answers[pid]:null,
  myKey:(pid in g.keyGuesses)?g.keyGuesses[pid]:null,
  solved:Object.assign({},g.solved),solvedRound:g.solvedRound.slice(),
  remain:live?Math.max(0,g.deadline-Date.now()):null,total:H.phase==='keyguess'?KEY_MS:ANSWER_MS,
  revealOk:g.revealOk,lost:g.lost,
  revived:(H.phase==='compose'&&g.rounds[g.round].length===0)?g.revived.slice():[],
  result:fin?Object.assign({},g.result,{keyGuesses:Object.assign({},g.keyGuesses),targets:g.targets.slice()}):null
 };
 return v;
}
function broadcast(){
 for(const p of H.players){
  if(p.bot)continue;
  if(p.id===myId){applyView(viewFor(myId));continue;}
  const c=conns[p.id];
  if(c&&c.open){try{c.send({t:'view',v:viewFor(p.id)});}catch(e){}}
 }
 scheduleBots();
}
function sendErr(pid,msg){if(pid===myId)toast(msg);else{const c=conns[pid];if(c&&c.open)c.send({t:'err',msg});}}
function hostRecv(peerId,d,c){
 if(!d||typeof d!=='object')return;
 const pid=alias[peerId]||peerId;
 if(d.t==='join'){
  const name=String(d.name||'').trim().slice(0,10)||'名無し';
  const off=H.players.find(p=>!p.online&&!p.bot&&p.name===name);
  if(off){alias[peerId]=off.id;conns[off.id]=c;off.online=true;broadcast();return;}
  if(!(H.phase==='wait'||H.phase==='result')){c.send({t:'err',msg:'ゲーム進行中です。終了後に参加してください'});return;}
  if(H.players.length>=10){c.send({t:'err',msg:'満員です（最大10人）'});return;}
  conns[peerId]=c;addPlayer(peerId,name,false);broadcast();return;
 }
 if(!pById(pid))return;
 handleAction(pid,d);
}
function hostDrop(c){
 const pid=alias[c.peer]||c.peer;
 if(conns[pid]!==c)return;
 delete conns[pid];
 const p=pById(pid);if(!p)return;
 if(H.phase==='wait'){H.players=H.players.filter(x=>x!==p);if(H.pick.s===pid)H.pick.s=null;if(H.pick.r===pid)H.pick.r=null;}else p.online=false;
 const g=H.game;
 if(g&&H.phase==='answer'&&!pending(answerers(g),g.answers).length){endAnswer();return;}
 if(g&&H.phase==='keyguess'&&!pending(interceptors(g),g.keyGuesses).length){finishGame();return;}
 broadcast();
}

/* ===== BOT（TESTルーム） ===== */
const botDone=new Set();
function scheduleBots(){
 if(!testMode||!H.game)return;
 const g=H.game,bots=H.players.filter(p=>p.bot).map(p=>p.id);
 const tag=H.gameNo+'-'+H.phase+'-'+g.round+'-'+(g.rounds[g.round]?g.rounds[g.round].length:0)+'-';
 const once=(id,ms,fn)=>{if(botDone.has(tag+id))return;botDone.add(tag+id);setTimeout(fn,ms);};
 if(H.phase==='compose'&&bots.includes(g.senderId))once(g.senderId,1800,()=>botCipher(g.senderId));
 if(H.phase==='answer')for(const id of answerers(g))if(bots.includes(id))once(id,1500+rint(6000),()=>botAnswer(id));
 if(H.phase==='keyguess')for(const id of interceptors(g))if(bots.includes(id))once(id,1500+rint(5000),()=>handleAction(id,{t:'keyguess',i:Math.random()<0.3?g.key:rint(KEYS.length)}));
}
function botCipher(id){
 const g=H.game;if(!g||H.phase!=='compose')return;
 const av=shuffle(KANA.filter(k=>!g.used.includes(k)));
 handleAction(id,{t:'cipher',text:av.slice(0,Math.min(av.length,2+rint(3))).join('')});
}
function botAnswer(id){
 const g=H.game;if(!g||H.phase!=='answer'||id in g.answers)return;
 const t=g.target,n=g.rounds[g.round].length;
 const p=id===g.receiverId?Math.min(0.9,0.45+0.2*n):0.15+0.05*n;
 let i=g.words.indexOf(t);
 if(Math.random()>p){const c=[...Array(WN).keys()].filter(x=>g.words[x]!==t);i=c[rint(c.length)];}
 handleAction(id,{t:'answer',i});
}

function lmsg(m){const e=document.getElementById('lmsg');if(e)e.textContent=m;}
function randCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=s[rint(s.length)];return c;}
function startTest(name){
 testMode=true;isHost=true;myId='me';roomCode='TEST';H=newHost();
 addPlayer('me',name,false);for(let i=0;i<3;i++)addPlayer('bot'+i,'',true);
 broadcast();
}
function hostRoom(name,code){
 if(typeof Peer==='undefined'){lmsg('通信ライブラリを読み込めませんでした');return;}
 lmsg('ルームを作成中…');
 peer=new Peer(PREFIX+code);
 peer.on('open',id=>{myId=id;isHost=true;roomCode=code;H=newHost();addPlayer(id,name,false);broadcast();});
 peer.on('connection',c=>{c.on('data',d=>hostRecv(c.peer,d,c));c.on('close',()=>hostDrop(c));});
 peer.on('error',e=>{if(e.type==='unavailable-id')lmsg('そのルームコードは使用中です');else if(!V)lmsg('接続エラー: '+e.type);else toast('通信エラー: '+e.type);});
}
function joinRoom(name,code){
 if(typeof Peer==='undefined'){lmsg('通信ライブラリを読み込めませんでした');return;}
 lmsg('接続中…');
 peer=new Peer();
 peer.on('open',id=>{
  myId=id;roomCode=code;
  hostConn=peer.connect(PREFIX+code,{reliable:true});
  hostConn.on('open',()=>hostConn.send({t:'join',name}));
  hostConn.on('data',d=>{if(d.t==='view')applyView(d.v);else if(d.t==='err'){if(!V)lmsg(d.msg);else toast(d.msg);}});
  hostConn.on('close',()=>toast('ホストとの接続が切れました'));
 });
 peer.on('error',e=>{if(e.type==='peer-unavailable')lmsg('ルームが見つかりません');else if(!V)lmsg('接続エラー: '+e.type);else toast('通信エラー: '+e.type);});
}
function act(a){if(isHost)handleAction(myId,a);else if(hostConn&&hostConn.open)hostConn.send(a);}

function applyView(v){

 localDeadline=(g&&g.remain!=null)?performance.now()+g.remain:null;if(g&&g.total)localTotal=g.total;
 const key=v.gameNo+'-'+v.phase+'-'+(g?g.round:'')+'-'+(g&&g.history[g.round]?g.history[g.round].atts.length:0);
 if(key!==local.phaseKey){
  local.phaseKey=key;local.sel=null;local.keySel=null;local.buf=[];lastTick=-1;
  if(prev&&prev.phase!==v.phase){
   if(v.phase==='answer')SE.send();
   else if(v.phase==='reveal')(g.revealOk?SE.ok:SE.ng)();

}

function kanaBoard(g,editable){
 const used=new Set(g.used),inBuf=new Set(local.buf.map(norm));
 let h='<div class="kana">';
 for(let d=0;d<5;d++)for(let r=0;r<11;r++){
  const k=KANA_ROWS[r][d];
  if(!k){h+='<span class="kt empty"></span>';continue;}
  const c=['kt'];if(used.has(k))c.push('used');else if(editable&&inBuf.has(k))c.push('inbuf');
  const can=editable&&!used.has(k)&&!inBuf.has(k);
  h+=`<button class="${c.join(' ')}" ${can?`data-act="tile" data-k="${k}"`:'disabled'}>${k}</button>`;
 }
 return h+'</div>';
}
function wordGrid(g){
 const wrong=new Set(),cur=g.history[g.round];
 if(cur&&cur.target==null)cur.atts.forEach(a=>{for(const id in a.res){const x=a.res[id];if(!x.ok&&x.ans!=null&&x.ans>=0)wrong.add(x.ans);}});
 const can=V.phase==='answer'&&g.answerers.includes(V.me)&&g.myAnswer==null;
 return `<div class="words">${g.words.map((w,i)=>{
  const gi=g.wordIds[i],c=['word'];let badge='';
  if(wrong.has(gi))c.push('wrong');
  if(g.target===gi){c.push('target');badge='<em class="badge tg">お題</em>';}
  if(can&&local.sel===i)c.push('sel');
  if(V.phase==='answer'&&g.myAnswer===gi)c.push('chosen');
  return `<button class="${c.join(' ')}" ${can?`data-act="word" data-i="${i}"`:'disabled'}>${badge}<span class="w">${esc(w.w)}</span>${w.r?`<span class="r">${esc(w.r)}</span>`:''}</button>`;
 }).join('')}</div>`;
}
function historyHtml(g){
 if(!g.history.some(h=>h.atts.length))return '<div class="sub">まだ暗号はありません</div>';
 const out=[];
 g.history.forEach((h,r)=>{
  if(!h.atts.length)return;
  const done=h.target!=null;
  out.unshift(`<div class="lround ${done?'done':''}">
   <div class="lrh"><span class="lrno">R${r+1}</span>${done?`<span class="sub">正解</span><b class="lrt">${esc(wordLabel(g,h.target))}</b>`:'<span class="sub">進行中</span>'}<span class="lrc">送信 ${h.atts.length}回</span></div>
   ${h.atts.map((a,i)=>`<div class="latt"><div class="lah"><span class="lno">${i+1}</span><span class="cchip">${esc(a.cipher)}</span><span class="lcnt">${[...a.cipher].filter(c=>c!=='ー').length}文字</span></div>${attRows(g,a)}</div>`).join('')}
  </div>`);
 });
 return out.join('');
}
function resultHtml(g){
 const r=g.result,k=KEYS[g.key];
 const rows=g.members.map(id=>{
  let role,detail;
  if(id===g.senderId||id===g.receiverId){role=id===g.senderId?'<span class="tag t-send">送信</span>':'<span class="tag t-recv">受信</span>';detail=g.lost?'伝達失敗':`外した${r.wrong}人 − 当てた${r.right}人`;}
  else{const kg=r.keyGuesses[id],kr=kg===g.key;role='<span class="tag t-inter">傍受</span>';detail=`解読${g.solved[id]||0}${kr?' ×2':''}<br><span class="sub">鍵:${kg==null?'未回答':esc(KEYS[kg].n)}</span> <span class="${kr?'ok':'ng'}">${kr?IC.ok:IC.ng}</span>`;}
  const tot=(V.players.find(p=>p.id===id)||{}).total;
  return `<tr><td><span style="display:flex;gap:6px;align-items:flex-start">${av(id,'md')}<span>${esc(pname(id))}<br>${role}</span></span></td><td>${detail}</td><td class="num">${r.scores[id]>0?'+':''}${r.scores[id]}</td><td class="num">${tot==null?'-':tot}</td></tr>`;
 }).join('');
 return `<div class="phase ${g.lost?'ngbg':'okbg'}"><div class="bigres">${g.lost?'ペアの負け':'3語の伝達成功'}</div>
 <div class="keybox" style="margin-top:10px">${IC.key}<div><div class="sub">鍵の正体</div>${ktag(k)} <b>${esc(k.n)}</b> <span class="sub">例：${esc(k.ex)}</span></div></div>
 <div class="sub" style="margin-top:8px">伝える単語：${r.targets.map((t,i)=>`R${i+1}「${esc(wordLabel(g,t))}」`).join(' ')}</div>
 <table style="margin-top:8px"><tr><th>プレイヤー</th><th>内訳</th><th style="text-align:right">今回</th><th style="text-align:right">累計</th></tr>${rows}</table>
 </div>${pickerHtml()}
 ${V.host?'<button class="primary big" data-act="start">次のゲームを開始</button>':'<div class="note center">ホストが次のゲームを開始するのを待っています</div>'}`;
}
function gameHtml(){
 const g=V.g,ph=V.phase;
 let h=topBar(`<span class="sub">G${V.gameNo}・R${Math.min(g.round+1,3)}/3</span>`);
 h+=stickyHtml(g);
 h+=roleCard(g);
 h+=phaseHtml(g);
 h+=`<div class="card"><h3>単語リスト</h3>${wordGrid(g)}</div>`;
 if(!(ph==='compose'&&g.role==='sender'))h+=`<div class="card"><h3><span>使える文字</span><span>残り ${KANA.length-g.used.length}/${KANA.length}</span></h3>${kanaBoard(g,false)}</div>`;
 h+=`<div class="card"><h3>暗号の履歴</h3>${historyHtml(g)}</div>`;
 h+=`<div class="card"><h3><span>プレイヤー</span><span>累計</span></h3>${playerList()}</div>`;
 if(V.host&&ph!=='result')h+=`<div class="foot"><button class="ghost small" data-act="abort">このゲームを中断して待機室へ</button></div>`;
 return h;
}
function modalHtml(){
 if(local.modal==='rules')return `<div class="modal" data-act="close"><div class="sheet" data-stop="1"><h3>ルール <button class="ghost small" data-act="close">閉じる</button></h3><ul>
 <li>送信者と受信者のペアが、傍受者に見破られないように3つの単語を伝えるゲーム。</li>
 <li>ペアにだけ「鍵」（20種類の条件から1つ）が知らされる。鍵とペアは3ラウンド共通。</li>
 <li>送信者は28語の単語リストから指定された1語を、鍵に沿ったひらがなの暗号で伝える。</li>
 <li>暗号に使えるのは50音の46文字。一度使った文字は使用済みになる。同じ暗号内での重複も不可。濁点・半濁点・小文字は元の文字を消費、「ー」は自由。</li>
 <li>暗号が届いたら60秒以内に送信者以外が回答し、一斉にオープン。</li>
 <li>受信者が外したら送信者は暗号を作り直す。受信者が当てるまで続き、使う文字はどんどん増える。</li>
 <li>当てた傍受者は答えを伏せたまま得点。そのラウンドはもう回答しない。</li>
 <li>受信者が当てて次のラウンドへ進むとき、単語リストが新しい28語に入れ替わり、使用済みの文字のうちランダムな半分（端数切り捨て）が復活する。</li>
 <li>文字を使い切って3語伝えられなければペアの負け。</li>
 <li>最後に傍受者は鍵を推理する。</li>
 <li><b>傍受者</b>：解読した数が得点。鍵を当てると2倍。</li>
 <li><b>ペア</b>：鍵を外した人数 − 当てた人数 が2人それぞれの得点。負けたら0点。</li>
 <li>1ゲームごとにペアが交代。累計得点で競う。</li></ul></div></div>`;
 if(local.modal==='keys')return `<div class="modal" data-act="close"><div class="sheet" data-stop="1"><h3>鍵リスト（20種） <button class="ghost small" data-act="close">閉じる</button></h3><div class="note" style="margin:0 0 8px">${ktag(KEYS[0])} 単語の<b>読み（ひらがな）</b>を使う鍵。カタカナ語もひらがなで考える。<br>${ktag(KEYS[10])} 単語から<b>連想</b>する鍵。<br>どの鍵も、送信者が条件に合う言葉を自由に選べる。</div><div class="keys">${KEYS.map((k,i)=>`<div class="keyitem" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="no">${i+1}</span>${ktag(k)}<span>${esc(k.n)}</span><span class="ex">${esc(k.ex)}</span></div>`).join('')}</div></div></div>`;
 return '';
}
function tickTimer(){
 const el=document.getElementById('timer');if(!el||localDeadline==null)return;
 const ms=Math.max(0,localDeadline-performance.now()),s=Math.ceil(ms/1000);
 el.textContent=s;
 const hurry=s<=10;
 const box=document.getElementById('timerBox');if(box)box.classList.toggle('hurry',hurry);
 const st=document.getElementById('sticky');if(st)st.classList.toggle('hurry',hurry);
 const bar=document.getElementById('timerBar');if(bar)bar.style.width=(ms/localTotal*100).toFixed(1)+'%';
 if(s<=5&&s>0&&s!==lastTick){lastTick=s;SE.tick();}
}
setInterval(tickTimer,200);

/* ===== 入力 ===== */
$app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el)return;
 if(el.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
 ac();
 const A=el.dataset.act;
 if(A==='create'||A==='join'){
  const name=document.getElementById('nm').value.trim().slice(0,10);
  const code=document.getElementById('rc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!name){lmsg('名前を入力してください');return;}
  try{localStorage.setItem('angoName',name);}catch(err){}
  if(code==='TEST'){startTest(name);return;}
  if(A==='create')hostRoom(name,code||randCode());
  else{if(!code){lmsg('ルームコードを入力してください');return;}joinRoom(name,code);}
  return;
 }
 if(A==='rules'||A==='keys'){local.modal=A;render();return;}
 if(A==='close'){local.modal=null;render();return;}
 if(!V)return;
 const g=V.g;
 switch(A){
 case 'start':act({t:'start'});break;
 case 'pick':act({t:'pick',role:el.dataset.role,id:el.dataset.id||null});break;
 case 'abort':if(confirm('このゲームを中断しますか？（得点は加算されません）'))act({t:'abort'});break;
 case 'tile':SE.tap();if(local.buf.length<20)local.buf.push(el.dataset.k);render();break;
 case 'dak':if(local.buf.length){const i=local.buf.length-1;local.buf[i]=cycleDak(local.buf[i]);SE.tap();render();}break;
 case 'small':if(local.buf.length){const i=local.buf.length-1;local.buf[i]=toggleSmall(local.buf[i]);SE.tap();render();}break;
 case 'bar':if(local.buf.length&&local.buf.length<20){local.buf.push('ー');SE.tap();render();}break;
 case 'bs':local.buf.pop();render();break;
 case 'send':if(local.buf.some(c=>c!=='ー'))act({t:'cipher',text:local.buf.join('')});break;
 case 'word':local.sel=+el.dataset.i;SE.tap();render();break;
 case 'decide':if(local.sel!=null)act({t:'answer',i:local.sel});break;
 case 'keysel':local.keySel=+el.dataset.i;SE.tap();render();break;
 case 'keydecide':if(local.keySel!=null)act({t:'keyguess',i:local.keySel});break;
 }
});
renderLobby();
</script>
</body>
</html>
